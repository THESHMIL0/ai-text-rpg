<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Ayushka ❤️</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --primary: #ff4757;
            --secondary: #2f3542;
            --glass: rgba(255, 255, 255, 0.7);
            --border: rgba(255, 255, 255, 0.5);
        }
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* ANIMATED GRADIENT BACKGROUND */
            background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #ffd1ff, #a18cd1);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            color: var(--secondary);
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- GLASSMORPHISM CONTAINERS --- */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        /* LOCK SCREEN */
        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(20px);
            transition: opacity 0.6s ease-out;
        }

        #login-box {
            padding: 3rem;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        /* MAIN APP CONTAINER */
        .container {
            padding: 2.5rem;
            max-width: 90%;
            width: 420px;
            text-align: center;
            display: none; /* Hidden until login */
            margin: 40px 0;
            position: relative;
            z-index: 10;
            animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* TYPOGRAPHY */
        h1 {
            font-family: 'Dancing Script', cursive;
            color: var(--primary);
            font-size: 3rem;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        p { font-size: 0.95rem; line-height: 1.6; opacity: 0.9; }

        input {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: 2px solid white;
            background: rgba(255,255,255,0.5);
            border-radius: 15px;
            outline: none;
            text-align: center;
            font-size: 1.1rem;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
        }
        input:focus { background: white; border-color: var(--primary); }

        /* PREMIUM BUTTONS */
        .btn {
            background: linear-gradient(135deg, #ff6b6b, #ff4757);
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.3);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }
        
        .btn:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(255, 71, 87, 0.4); }
        .btn:active { transform: scale(0.98); }

        /* MOOD GRID */
        .mood-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 25px 0;
        }
        .mood-btn {
            background: rgba(255,255,255,0.6);
            border: none;
            padding: 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .mood-btn:hover { background: white; transform: translateY(-5px); color: var(--primary); }
        .mood-icon { font-size: 2rem; display: block; margin-bottom: 5px; }

        /* DANGER BUTTON (PULSING) */
        .danger-btn {
            background: linear-gradient(135deg, #ff4757, #2f3542);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(255, 71, 87, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }

        /* GIFT BOX */
        .gift-container {
            background: white;
            padding: 20px;
            border-radius: 20px;
            margin: 25px 0;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            transition: 0.3s;
        }
        .gift-container:hover { transform: scale(1.02); }
        
        /* MODAL */
        #message-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            max-width: 85%;
            width: 350px;
            text-align: center;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* FLOATING EMOJIS */
        .floating-emoji {
            position: fixed;
            pointer-events: none;
            animation: floatUp 3s ease-out forwards;
            z-index: 9999;
        }
        @keyframes floatUp {
            from { transform: translateY(100vh) scale(0.5); opacity: 1; }
            to { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

    </style>
</head>
<body>

    <div id="login-screen" class="glass-card">
        <div id="login-box">
            <h1 style="font-size: 2.5rem; margin-bottom: 10px;">Locked 🔒</h1>
            <p>This page is protected by love.</p>
            <input type="text" id="password-input" placeholder="Enter your name..." autocomplete="off">
            <button class="btn" style="margin-top: 20px;" onclick="checkPassword()">Unlock Access</button>
            <p id="error-msg" style="color:#ff4757; display:none; margin-top:10px; font-weight:bold;">Hint: Your beautiful name (Ayushka)</p>
        </div>
    </div>

    <div class="container glass-card" id="main-content">
        <h1>Hey Ayushka!</h1>
        <p style="margin-bottom: 30px;">Welcome to your personal love station.</p>

        <button class="btn" onclick="sendKiss()">
            💋 Send a Flying Kiss
        </button>

        <p style="text-align:left; font-size:0.8rem; font-weight:700; color:#888; margin-top:30px; letter-spacing:1px;">OPEN WHEN...</p>
        <div class="mood-grid">
            <button class="mood-btn" onclick="openMessage('miss')">
                <span class="mood-icon">💌</span>Miss You
            </button>
            <button class="mood-btn" onclick="openMessage('sad')">
                <span class="mood-icon">🧸</span>Sad
            </button>
            <button class="mood-btn" onclick="openMessage('happy')">
                <span class="mood-icon">✨</span>Happy
            </button>
            <button class="mood-btn" onclick="openMessage('us')">
                <span class="mood-icon">🔒</span>Future
            </button>
        </div>

        <div class="gift-container" onclick="openGift()">
            <div id="gift-icon" style="font-size: 3.5rem;">🎁</div>
            <p id="gift-label" style="font-weight: 600; margin-top: 10px;">Tap to Unwrap</p>
            <div id="gift-content" style="display:none; animation: popIn 0.5s;">
                <div style="font-size: 3rem;">💍</div>
                <h3 style="color: var(--primary); margin: 5px 0;">Promise Ring</h3>
                <small>No matter the distance, I am yours.</small>
            </div>
        </div>

        <div style="background: rgba(255,255,255,0.5); padding: 15px; border-radius: 15px; margin-top: 20px;">
            <p style="font-weight: 600; margin:0 0 10px 0;">🧬 COMPATIBILITY SCAN</p>
            <button class="btn" id="calc-btn" style="background: #2f3542; transform: none;" onclick="calculateLove()">Tap Fingerprint 👆</button>
            <div id="love-result" style="display:none; font-size: 1.8rem; font-weight: 800; color: #ff4757;">100% MATCH! 🔥</div>
        </div>

        <div style="margin-top: 20px;">
            <button class="btn" style="background: linear-gradient(135deg, #a18cd1, #fbc2eb);" onclick="pickDate()">🔮 Generate Date Idea</button>
            <p id="date-idea" style="font-weight: 600; color: #574b90; min-height: 25px; margin-top: 5px;"></p>
        </div>

        <button class="btn danger-btn" style="margin-top: 40px;" onclick="triggerExplosion()">🚫 DO NOT PRESS</button>

    </div>

    <div id="message-modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div style="font-size: 4rem; margin-bottom: 10px;" id="modal-emoji"></div>
            <h2 id="modal-title" style="font-family:'Dancing Script'; color: var(--primary); margin: 0;"></h2>
            <p id="modal-body" style="font-size: 1.1rem; margin: 20px 0; color: #555;"></p>
            <button class="btn" onclick="closeModal()" style="width: auto; padding: 10px 30px;">Close</button>
        </div>
    </div>

    <script>
        const password = "Ayushka"; 

        // 1. LOCK SCREEN
        function checkPassword() {
            const input = document.getElementById("password-input").value;
            if (input.toLowerCase() === password.toLowerCase()) {
                const screen = document.getElementById("login-screen");
                screen.style.opacity = "0";
                setTimeout(() => {
                    screen.style.display = "none";
                    document.getElementById("main-content").style.display = "block";
                }, 600);
            } else {
                const msg = document.getElementById("error-msg");
                msg.style.display = "block";
                msg.classList.add("shake");
                setTimeout(() => msg.classList.remove("shake"), 500);
            }
        }

        // 2. OPEN WHEN MESSAGES
        const messages = {
            'miss': { emoji: "🌏", title: "Missing You?", text: "Remember that we are under the same sky. Close your eyes and I'm there." },
            'sad': { emoji: "🫂", title: "Feeling Down?", text: "I wish I could hold you right now. You are stronger than you know. I love you." },
            'happy': { emoji: "✨", title: "Yay!", text: "Your happiness is my favorite thing in the world. Save this moment!" },
            'us': { emoji: "🔒", title: "Our Future", text: "Distance is just a test. One day we will wake up next to each other every day." }
        };

        function openMessage(mood) {
            const data = messages[mood];
            document.getElementById("modal-emoji").innerText = data.emoji;
            document.getElementById("modal-title").innerText = data.title;
            document.getElementById("modal-body").innerText = data.text;
            document.getElementById("message-modal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("message-modal").style.display = "none";
        }

        // 3. GIFT BOX LOGIC
        function openGift() {
            const icon = document.getElementById("gift-icon");
            const label = document.getElementById("gift-label");
            const content = document.getElementById("gift-content");
            
            if (content.style.display === "none") {
                icon.style.display = "none";
                label.style.display = "none";
                content.style.display = "block";
                triggerConfetti();
            }
        }

        // 4. LOVE CALCULATOR
        function calculateLove() {
            const btn = document.getElementById("calc-btn");
            btn.innerText = "Scanning Fingerprint...";
            btn.style.opacity = "0.7";
            
            setTimeout(() => {
                btn.style.display = "none";
                const result = document.getElementById("love-result");
                result.style.display = "block";
                triggerConfetti();
            }, 1500);
        }

        // 5. KISS ANIMATION
        function sendKiss() {
            createEmoji("💋");
            createEmoji("❤️");
        }

        // 6. DATE GENERATOR
        const dates = ["Late Night Drive 🚗", "Cooking Together 🍝", "Movie Marathon 🎬", "Beach Walk 🌊", "Stargazing ✨", "Arcade Date 🎮"];
        function pickDate() {
            const display = document.getElementById("date-idea");
            display.style.opacity = "0";
            setTimeout(() => {
                display.innerText = dates[Math.floor(Math.random() * dates.length)];
                display.style.opacity = "1";
            }, 200);
        }

        // 7. EXPLOSION
        function triggerExplosion() {
            alert("⚠️ WARNING: EXTREME LOVE DETECTED!");
            setInterval(() => createEmoji("💖"), 100);
            setInterval(() => createEmoji("😍"), 150);
        }

        // HELPER: CREATE FLOATING EMOJI
        function createEmoji(char) {
            const el = document.createElement("div");
            el.innerText = char;
            el.classList.add("floating-emoji");
            el.style.left = Math.random() * 100 + "vw";
            el.style.fontSize = (Math.random() * 2 + 1.5) + "rem";
            el.style.animationDuration = (Math.random() * 2 + 2) + "s";
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }
        
        // HELPER: CONFETTI (Simple version)
        function triggerConfetti() {
            for(let i=0; i<20; i++) {
                setTimeout(() => createEmoji("🎉"), i * 100);
            }
        }
    </script>
</body>
</html>
