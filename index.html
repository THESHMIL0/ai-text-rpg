<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Theshu & Ayuuu</title>
    <style>
        /* --- MINIMALIST CORE --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            margin: 0; padding: 0; width: 100vw; height: 100dvh;
            background: #fff5f7; color: #333; overflow: hidden;
        }

        /* --- LOCK SCREEN (Simple) --- */
        #lock {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ff4757; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; transition: transform 0.4s ease;
        }
        .heart-btn {
            font-size: 4rem; animation: beat 1s infinite; cursor: pointer;
            background: white; width: 100px; height: 100px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        /* --- APP LAYOUT --- */
        .app-container {
            display: flex; flex-direction: column; height: 100%;
        }

        /* Content Area */
        .content { flex: 1; overflow-y: auto; padding: 20px; display: none; animation: fadeIn 0.3s; }
        .content.active { display: flex; flex-direction: column; }

        /* Bottom Navigation */
        .nav-bar {
            height: 80px; background: white; border-top: 1px solid #eee;
            display: flex; justify-content: space-around; align-items: center;
            padding-bottom: 20px; flex-shrink: 0;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; 
            color: #ccc; font-size: 0.8rem; font-weight: 600; cursor: pointer;
        }
        .nav-item.active { color: #ff4757; }
        .nav-icon { font-size: 1.5rem; margin-bottom: 4px; }

        /* --- TAB 1: HOME --- */
        .hero { text-align: center; margin-top: 20px; }
        .hero h1 { font-size: 2.5rem; color: #ff4757; margin: 0; }
        .hero p { color: #888; margin-top: 5px; font-weight: 500; }

        .big-card {
            background: white; border-radius: 20px; padding: 30px; margin-top: 30px;
            text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        .days-count { font-size: 4rem; font-weight: 800; color: #ff4757; line-height: 1; }
        .days-label { color: #aaa; font-weight: 600; letter-spacing: 1px; margin-top: 5px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .small-card { background: white; padding: 20px; border-radius: 15px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.03); }

        /* --- TAB 2: CHAT --- */
        .chat-list { flex: 1; display: flex; flex-direction: column; gap: 15px; padding-bottom: 20px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 1rem; line-height: 1.4; }
        .them { background: white; border: 1px solid #eee; align-self: flex-start; }
        .me { background: #ff4757; color: white; align-self: flex-end; }
        
        .chat-controls { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
        .reply-btn {
            background: white; border: 1px solid #ff4757; color: #ff4757; 
            padding: 12px; border-radius: 12px; font-weight: 600; font-size: 1rem;
        }

        /* --- TAB 3: MEMORIES --- */
        .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .photo-box { 
            aspect-ratio: 1/1; background: #ddd; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            background-size: cover; background-position: center;
        }
        .add-btn { border: 2px dashed #ccc; background: white; color: #ccc; font-size: 2rem; }

        /* Animation */
        @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hidden { display: none; }

    </style>
</head>
<body>

    <div id="lock" onclick="unlock()">
        <div class="heart-btn">❤️</div>
        <p style="margin-top: 20px; font-weight: 600;">Tap to Open</p>
    </div>

    <div class="app-container">
        
        <div id="tab-home" class="content active">
            <div class="hero">
                <p>GOOD MORNING</p>
                <h1>Ayuuuu ❤️</h1>
            </div>

            <div class="big-card">
                <div class="days-count" id="days">0</div>
                <div class="days-label">DAYS TOGETHER</div>
                <div style="margin-top:10px; color:#ccc; font-size:0.8rem;">Since Jan 18, 2026</div>
            </div>

            <div class="grid">
                <div class="small-card">
                    <div style="font-size:2rem;">🔋</div>
                    <div style="font-weight:700; margin-top:5px; color:#4cd137;">100%</div>
                    <div style="font-size:0.8rem; color:#aaa;">Love</div>
                </div>
                <div class="small-card">
                    <div style="font-size:2rem;">🎂</div>
                    <div style="font-weight:700; margin-top:5px; color:#ff9f43;">Mar 14</div>
                    <div style="font-size:0.8rem; color:#aaa;">My Bday</div>
                </div>
            </div>
        </div>

        <div id="tab-chat" class="content">
            <div class="hero" style="margin-bottom:20px;">
                <h1>Theshuuuu 💬</h1>
            </div>
            <div class="chat-list" id="msgs">
                <div class="msg them">Hey Ayuuu! ❤️</div>
            </div>
            <div class="chat-controls" id="opts">
                <button class="reply-btn" onclick="nextChat()">Hey Theshu! 👋</button>
            </div>
        </div>

        <div id="tab-memories" class="content">
            <div class="hero" style="margin-bottom:20px;">
                <h1>Our Photos 📸</h1>
            </div>
            <div class="gallery" id="gallery">
                <div class="photo-box add-btn" onclick="document.getElementById('file').click()">+</div>
            </div>
            <input type="file" id="file" hidden accept="image/*" onchange="addPhoto(this)">
        </div>

        <div class="nav-bar">
            <div class="nav-item active" onclick="switchTab('home', this)">
                <div class="nav-icon">🏠</div><div>Home</div>
            </div>
            <div class="nav-item" onclick="switchTab('chat', this)">
                <div class="nav-icon">💬</div><div>Chat</div>
            </div>
            <div class="nav-item" onclick="switchTab('memories', this)">
                <div class="nav-icon">📸</div><div>Photos</div>
            </div>
        </div>

    </div>

    <script>
        function unlock() {
            document.getElementById('lock').style.transform = 'translateY(-100%)';
        }

        function switchTab(id, el) {
            // Hide all
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            // Show selected
            document.getElementById('tab-' + id).classList.add('active');
            el.classList.add('active');
        }

        // --- DATE LOGIC ---
        const start = new Date("2026-01-18");
        const diff = Math.floor((new Date() - start) / (1000 * 60 * 60 * 24));
        document.getElementById('days').innerText = diff > 0 ? diff : 0;

        // --- CHAT LOGIC ---
        let step = 0;
        const msgs = document.getElementById('msgs');
        const opts = document.getElementById('opts');
        
        const script = [
            { me: "Hey Theshu! 👋", them: "I miss you so much. Thinking about Jan 18 makes me smile. ❤️" },
            { me: "Me too! 🥰", them: "Distance is hard, but you are worth it. I have a question..." },
            { me: "What is it? 😮", them: "<b>Will you be my Valentine?</b> Forever? 💍" },
            { me: "YES! Of course! ❤️", them: "I knew it! ❤️ One day I'll put a real ring on your finger. 💍" }
        ];

        function nextChat() {
            if(step >= script.length) return;
            
            // Me
            const m = document.createElement('div'); m.className = 'msg me'; m.innerHTML = script[step].me;
            msgs.appendChild(m);
            opts.innerHTML = ''; // Hide buttons

            // Them
            setTimeout(() => {
                const t = document.createElement('div'); t.className = 'msg them'; t.innerHTML = script[step].them;
                msgs.appendChild(t);
                msgs.scrollTop = msgs.scrollHeight;
                step++;
                
                // Next Button
                if(step < script.length) {
                    opts.innerHTML = `<button class="reply-btn" onclick="nextChat()">${script[step].me}</button>`;
                } else {
                    opts.innerHTML = `<div style="text-align:center; color:#ff4757; font-weight:bold;">❤️ Love You ❤️</div>`;
                }
            }, 1000);
        }

        // --- PHOTO LOGIC ---
        function addPhoto(input) {
            if(input.files[0]) {
                const div = document.createElement('div');
                div.className = 'photo-box';
                div.style.backgroundImage = `url(${URL.createObjectURL(input.files[0])})`;
                document.getElementById('gallery').appendChild(div);
            }
        }
    </script>
</body>
</html>
