<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Ayushka ❤️</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Dancing+Script:wght@700&family=Indie+Flower&display=swap" rel="stylesheet">

    <style>
        /* --- CORE THEME --- */
        :root {
            --bg-grad: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            --text: #333;
            --primary: #ff6b81;
            --blue: #007aff;
            --gray: #f2f2f7;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0; height: 100vh; width: 100vw;
            background: var(--bg-grad);
            font-family: 'Poppins', sans-serif;
            overflow: hidden; color: var(--text);
        }

        /* --- 1. VALENTINE ENTRY SCREEN --- */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffe6eb; z-index: 9999;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
        }

        .title { font-family: 'Dancing Script'; font-size: 3.5rem; color: #ff4757; margin-bottom: 20px; animation: pulse 2s infinite; }
        
        .btn-box { display: flex; gap: 20px; justify-content: center; width: 100%; }
        
        .big-btn {
            padding: 15px 40px; border-radius: 50px; border: none; font-size: 1.2rem; font-weight: bold;
            cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.1); transition: 0.2s;
        }
        .yes { background: #ff4757; color: white; }
        .no { background: white; color: #333; position: relative; }
        .yes:active { transform: scale(0.9); }

        /* --- 2. MAIN OS --- */
        #main-os { display: none; width: 100%; height: 100%; animation: fade 1s; }
        @keyframes fade { from{opacity:0} to{opacity:1} }

        .status-bar { height: 30px; padding: 5px 20px; display: flex; justify-content: space-between; color: white; font-weight: bold; font-size: 0.8rem; }
        
        .home-title { font-family: 'Indie Flower'; font-size: 2.8rem; color: white; text-align: center; margin-top: 40px; }

        .app-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; padding: 40px; margin-top: 30px; }
        
        .app-icon { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .app-icon:active { transform: scale(0.95); }
        
        .icon-box {
            width: 70px; height: 70px; border-radius: 18px; background: white;
            display: flex; align-items: center; justify-content: center; font-size: 2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 8px;
        }
        .icon-label { color: white; font-size: 0.9rem; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }

        /* --- WINDOWS --- */
        .window {
            position: fixed; top: 100vh; left: 0; width: 100%; height: 100%;
            background: #f8f8f8; z-index: 5000; transition: top 0.3s ease-out;
            display: flex; flex-direction: column;
        }
        .window.open { top: 0; }
        
        .header {
            height: 55px; background: white; border-bottom: 1px solid #ddd; display: flex;
            align-items: center; justify-content: space-between; padding: 0 20px; font-weight: 600;
        }
        .close { color: #ff4757; cursor: pointer; font-size: 1rem; }
        
        .content { flex: 1; overflow-y: auto; padding: 20px; }

        /* --- CHAT --- */
        #chat-box { display: flex; flex-direction: column; gap: 10px; padding-bottom: 80px; }
        .bubble { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 0.95rem; text-align: left; }
        .rcvd { background: #e5e5ea; align-self: flex-start; border-bottom-left-radius: 4px; }
        .sent { background: #007aff; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .gift-bub { background: #ffeaa7; width: 100%; text-align: center; cursor: pointer; align-self: center; }
        
        .opts { position: absolute; bottom: 0; width: 100%; background: white; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #eee; }
        .opt-btn { flex: 1; padding: 12px; border-radius: 20px; border: none; background: #007aff; color: white; font-weight: bold; }

        /* --- GAME --- */
        #game-board { width: 100%; height: 400px; background: #222; border-radius: 15px; position: relative; overflow: hidden; margin-top: 10px; }
        .heart { position: absolute; font-size: 2.5rem; top: -50px; cursor: pointer; }
        @keyframes fall { to { top: 450px; } }

        /* --- SETTINGS --- */
        .simple-list { background: white; border-radius: 10px; overflow: hidden; }
        .list-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; font-size: 0.95rem; }
        .list-item:last-child { border-bottom: none; }
        .val { color: #888; }

        /* --- CAMERA --- */
        .cam-view { width: 100%; height: 300px; background: black; border-radius: 15px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        /* ANIMATIONS */
        @keyframes pulse { 0% {transform:scale(1);} 50% {transform:scale(1.05);} 100% {transform:scale(1);} }
        @keyframes bounce { 0%, 100% {transform:translateY(0);} 50% {transform:translateY(-10px);} }
        .gift-icon { font-size: 3rem; animation: bounce 1s infinite; }

    </style>
</head>
<body>

    <div id="intro-screen">
        <h1 class="title">Ayushka,<br>Will you be my<br>Valentine?</h1>
        <div class="btn-box">
            <button class="big-btn yes" onclick="enterOS()" ontouchstart="enterOS()">YES ❤️</button>
            <button class="big-btn no" id="noBtn" onclick="moveNo()" onmouseover="moveNo()">NO 😤</button>
        </div>
    </div>

    <div id="main-os">
        <div class="status-bar"><span>11:11</span><span>❤️ 5G</span><span>100%</span></div>
        <h2 class="home-title">Hey Ayuuu ❤️</h2>

        <div class="app-grid">
            <div class="app-icon" onclick="openApp('chat')"><div class="icon-box" style="background:#4cd137;">💬</div><span class="icon-label">Chat</span></div>
            <div class="app-icon" onclick="openApp('game')"><div class="icon-box" style="background:#ff9f43;">🎈</div><span class="icon-label">Game</span></div>
            <div class="app-icon" onclick="openApp('cam')"><div class="icon-box" style="background:#333; color:white;">📸</div><span class="icon-label">Camera</span></div>
            <div class="app-icon" onclick="openApp('set')"><div class="icon-box" style="background:#8e8e93; color:white;">⚙️</div><span class="icon-label">Settings</span></div>
        </div>
    </div>

    <div id="app-chat" class="window">
        <div class="header">Theshu ❤️ <span class="close" onclick="closeApp('chat')">Done</span></div>
        <div class="content" style="background:white;">
            <div id="chat-box"></div>
        </div>
        <div class="opts" id="chat-opts">
            <button class="opt-btn" onclick="startChat()">Tap to Chat 💌</button>
        </div>
    </div>

    <div id="app-game" class="window">
        <div class="header">Heart Rain <span class="close" onclick="closeApp('game')">Done</span></div>
        <div class="content" style="background:#feca57; text-align:center;">
            <h3>Score: <span id="score">0</span> | <span id="lives">❤️❤️❤️</span></h3>
            <p>High Score: <span id="hs">0</span></p>
            <div id="game-board"></div>
            <button class="big-btn yes" onclick="startGame()" id="start-btn" style="margin-top:20px;">Play ▶️</button>
        </div>
    </div>

    <div id="app-cam" class="window">
        <div class="header">Camera <span class="close" onclick="closeApp('cam')">Done</span></div>
        <div class="content" style="background:black; text-align:center;">
            <div class="cam-view"><img id="preview" src="" style="width:100%; height:100%; object-fit:cover; display:none;"><span id="cam-ph" style="font-size:3rem; color:white;">📷</span></div>
            <label class="big-btn yes" style="margin-top:20px; display:inline-block; color:white;">Selfie <input type="file" accept="image/*" style="display:none;" onchange="loadPic(event)"></label>
        </div>
    </div>

    <div id="app-set" class="window">
        <div class="header">Settings <span class="close" onclick="closeApp('set')">Done</span></div>
        <div class="content" style="background:#f2f2f7;">
            <p style="margin-left:10px; font-size:0.8rem; color:#666;">INFO</p>
            <div class="simple-list">
                <div class="list-item"><span>Name</span> <span class="val">Ayushka</span></div>
                <div class="list-item"><span>Version</span> <span class="val">Theshu OS 30.0</span></div>
            </div>
            <p style="margin-left:10px; font-size:0.8rem; color:#666; margin-top:20px;">STATUS</p>
            <div class="simple-list">
                <div class="list-item"><span>Battery</span> <span class="val">100% Love</span></div>
                <div class="list-item"><span>Developer</span> <span class="val">Theshmil</span></div>
                <div class="list-item"><span>Pet</span> <span class="val">Kitchu 🐈‍⬛</span></div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. ENTRY LOGIC ---
        function enterOS() {
            document.getElementById('intro-screen').style.display = 'none';
            document.getElementById('main-os').style.display = 'block';
            document.getElementById('hs').innerText = localStorage.getItem('hs') || 0;
        }
        
        function moveNo() {
            const b = document.getElementById('noBtn');
            b.style.position = 'absolute';
            b.style.left = Math.random()*(window.innerWidth-100)+'px';
            b.style.top = Math.random()*(window.innerHeight-100)+'px';
        }

        // --- 2. NAVIGATION ---
        function openApp(id) { document.getElementById('app-'+id).classList.add('open'); }
        function closeApp(id) { document.getElementById('app-'+id).classList.remove('open'); }

        // --- 3. CHAT LOGIC (ROMANTIC & DEEP) ---
        const script = [
            { 
                t: "Hey Ayushka... ❤️", 
                o: [{l:"Hi Theshu! 🥰", n:1}, {l:"Hey love ✨", n:1}] 
            },
            { 
                t: "I built this entire world just for you. Because you deserve everything. 🌍", 
                o: [{l:"Aww really? 🥺", n:2}, {l:"You are the best ❤️", n:2}] 
            },
            { 
                t: "I just wanted to remind you... no matter what happens, I am always right here by your side. ✨", 
                o: [{l:"Promise? 💍", n:3}, {l:"I love you 🥺", n:3}] 
            },
            { 
                t: "Yes! You are the best thing that ever happened to me. Stuck with me forever! 🔒", 
                o: [{l:"Forever! ❤️", n:-1}, {l:"Stuck with you! 😜", n:-1}] 
            }
        ];

        function startChat() {
            document.getElementById('chat-opts').innerHTML = '';
            addBub(script[0].t, 'rcvd');
            showOpts(script[0].o);
        }

        function reply(n, l) {
            addBub(l, 'sent');
            document.getElementById('chat-opts').innerHTML = '';
            
            const typing = document.createElement('div');
            typing.className = 'bubble rcvd'; typing.innerText = '...'; typing.id='typ';
            document.getElementById('chat-box').appendChild(typing);

            setTimeout(() => {
                document.getElementById('typ').remove();
                if(n === -1) {
                    addBub("Now... I have a special gift for you. 👇", 'rcvd');
                    spawnGift();
                } else {
                    addBub(script[n].t, 'rcvd');
                    showOpts(script[n].o);
                }
            }, 1000);
        }

        function spawnGift() {
            const d = document.createElement('div');
            d.className = 'bubble gift-bub';
            d.innerHTML = '<div class="gift-icon" onclick="tapGift(this)">🎁</div><div id="g-txt" style="display:none; font-weight:bold; padding:10px;">Tap!</div>';
            document.getElementById('chat-box').appendChild(d);
            document.getElementById('app-chat').querySelector('.content').scrollTop = 9999;
        }

        let gStep = 0;
        function tapGift(el) {
            const t = document.getElementById('g-txt');
            t.style.display = 'block';
            if(gStep === 0) {
                el.innerText = "🍦";
                t.innerText = "Ice Cream for my sweet! 🍦\n(Tap one more time...)";
                gStep++;
            } else {
                el.innerText = "💍";
                t.innerText = "And a Ring! 💍\n(Promise Forever) ❤️";
                confetti();
            }
        }

        function addBub(t, c) {
            const d = document.createElement('div');
            d.className = 'bubble ' + c;
            d.innerText = t;
            document.getElementById('chat-box').appendChild(d);
            document.getElementById('app-chat').querySelector('.content').scrollTop = 9999;
        }
        function showOpts(opts) {
            const c = document.getElementById('chat-opts');
            c.innerHTML = '';
            opts.forEach(o => {
                const b = document.createElement('button');
                b.className = 'opt-btn'; b.innerText = o.l;
                b.onclick = () => reply(o.n, o.l);
                c.appendChild(b);
            });
        }

        // --- 4. GAME LOGIC ---
        let score=0, lives=3, active=false;
        function startGame() {
            active=true; score=0; lives=3;
            document.getElementById('start-btn').style.display='none';
            document.getElementById('game-board').innerHTML='';
            document.getElementById('lives').innerText='❤️❤️❤️';
            document.getElementById('score').innerText='0';
            loop();
        }
        function loop() { if(active) { spawn(); setTimeout(loop, 800); } }
        function spawn() {
            const h = document.createElement('div');
            h.innerText='❤️'; h.className='heart';
            h.style.left=Math.random()*250+'px';
            h.style.animation='fall 3s linear forwards';
            h.onmousedown = function() {
                score++; document.getElementById('score').innerText=score; this.remove();
            };
            h.onanimationend = function() {
                this.remove(); lives--; 
                document.getElementById('lives').innerText='❤️'.repeat(lives);
                if(lives<=0) {
                    active=false; alert("Score: "+score);
                    const hs = Math.max(score, localStorage.getItem('hs')||0);
                    localStorage.setItem('hs', hs);
                    document.getElementById('hs').innerText=hs;
                    document.getElementById('start-btn').style.display='inline-block';
                }
            };
            document.getElementById('game-board').appendChild(h);
        }

        // --- 5. UTILS ---
        function loadPic(e) {
            document.getElementById('preview').src = URL.createObjectURL(e.target.files[0]);
            document.getElementById('preview').style.display='block';
            document.getElementById('cam-ph').style.display='none';
        }
        function confetti() {
            const c = document.createElement('div');
            c.style.position='fixed'; c.style.background='red'; c.style.width='10px'; c.style.height='10px';
            c.style.top='0'; c.style.left=Math.random()*100+'vw'; c.style.zIndex='9999';
            c.style.transition='top 2s'; document.body.appendChild(c);
            setTimeout(()=>c.style.top='100vh',10);
        }
    </script>
</body>
</html>
