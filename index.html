<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#fff5f7">
    <title>Theshu ❤️ Ayuuu</title>
    <style>
        /* --- CORE --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        
        body { 
            margin: 0; padding: 0; width: 100vw; height: 100dvh;
            background: #fff5f7; color: #333; overflow: hidden;
        }

        /* --- LOCK SCREEN (Fingerprint) --- */
        #lock {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #ff9a9e 0%, #ff6b81 100%);
            z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; transition: transform 0.5s ease-in-out;
        }
        
        .scanner {
            width: 80px; height: 80px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; position: relative;
            margin-bottom: 20px; cursor: pointer;
        }
        .scanner::after {
            content: ''; position: absolute; width: 100%; height: 100%; border-radius: 50%;
            border: 2px solid white; animation: ripple 1.5s infinite; opacity: 0;
        }
        .scan-icon { font-size: 3rem; }
        .scanning .scan-icon { color: #fff; text-shadow: 0 0 10px white; }

        /* --- LAYOUT --- */
        .app-container { display: flex; flex-direction: column; height: 100%; }
        .content { 
            flex: 1; overflow-y: auto; padding: 20px; display: none; 
            padding-bottom: 100px; -webkit-overflow-scrolling: touch;
        }
        .content.active { display: block; animation: fadeIn 0.3s; }

        /* --- MAP WIDGET (NEW) --- */
        .map-card {
            background: white; border-radius: 20px; padding: 20px; margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03); position: relative; overflow: hidden;
        }
        .map-line {
            height: 2px; background: #eee; width: 80%; margin: 20px auto; position: relative;
            border-top: 2px dashed #ff4757; background: transparent;
        }
        .plane {
            position: absolute; top: -12px; left: 0; font-size: 1.5rem;
            animation: fly 4s linear infinite;
        }
        .locations { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: #555; padding: 0 10px; }

        /* --- DRAWING CANVAS (NEW) --- */
        .canvas-container {
            background: white; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            height: 300px; position: relative; touch-action: none; border: 2px dashed #eee;
        }
        canvas { width: 100%; height: 100%; border-radius: 20px; }
        .tools { display: flex; gap: 10px; margin-top: 15px; justify-content: center; }
        .tool-btn { padding: 10px 20px; border-radius: 20px; border: none; font-weight: 600; cursor: pointer; }
        .btn-clear { background: #eee; color: #333; }
        .btn-save { background: #ff4757; color: white; }

        /* --- MUSIC PLAYER --- */
        .music-card {
            background: white; border-radius: 20px; padding: 15px; margin-bottom: 15px;
            display: flex; align-items: center; gap: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.03);
        }
        .album-art { 
            width: 50px; height: 50px; background: #333; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; color: white;
            animation: spin 5s linear infinite; animation-play-state: paused;
        }
        .album-art.playing { animation-play-state: running; }

        /* --- CHAT --- */
        .chat-list { display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 14px 18px; border-radius: 20px; font-size: 0.95rem; }
        .them { background: white; align-self: flex-start; }
        .me { background: #ff4757; color: white; align-self: flex-end; }

        /* --- NAV BAR --- */
        .nav-bar {
            height: 75px; background: rgba(255,255,255,0.95); border-top: 1px solid #f0f0f0;
            display: flex; justify-content: space-around; align-items: center;
            padding-bottom: env(safe-area-inset-bottom); z-index: 50;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #ccc; font-size: 0.7rem; font-weight: 600; }
        .nav-item.active { color: #ff4757; }
        .nav-icon { font-size: 1.5rem; margin-bottom: 3px; }

        /* --- HERO --- */
        .hero { margin: 20px 0; text-align: left; padding: 0 10px; }
        .hero h1 { font-size: 2rem; color: #ff4757; margin: 0; }
        .hero p { color: #ff8fa3; font-weight: 700; font-size: 0.8rem; letter-spacing: 1px; }

        /* Animations */
        @keyframes ripple { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.5); opacity: 0; } }
        @keyframes fly { 0% { left: 0%; transform: rotate(0deg); } 50% { top: -20px; } 100% { left: 90%; transform: rotate(10deg); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <div id="lock" onmousedown="startUnlock()" onmouseup="stopUnlock()" ontouchstart="startUnlock()" ontouchend="stopUnlock()">
        <div class="scanner" id="scanner">
            <div class="scan-icon">👆</div>
        </div>
        <p style="font-weight: 600; margin-top: 10px;">Touch & Hold ID</p>
    </div>

    <div class="app-container">
        
        <div id="tab-home" class="content active">
            <div class="hero">
                <p>GOOD MORNING</p>
                <h1>My Ayuuu ❤️</h1>
            </div>

            <div class="music-card" onclick="toggleMusic()">
                <div class="album-art" id="vinyl">🎵</div>
                <div style="flex:1;">
                    <div style="font-weight:700;">Your Voice</div>
                    <div style="font-size:0.8rem; color:#888;">Tap to Play/Pause</div>
                </div>
                <div style="font-size:1.5rem;">▶️</div>
            </div>

            <div class="map-card">
                <div style="font-size:0.8rem; font-weight:700; color:#aaa; margin-bottom:15px; text-transform:uppercase;">Distance is Temporary</div>
                <div class="map-line">
                    <div class="plane">✈️</div>
                </div>
                <div class="locations">
                    <span>Theshu</span>
                    <span>Ayuuuu</span>
                </div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; text-align:center;">
                <div style="background:white; padding:20px; border-radius:15px;">
                    <div style="font-size:2rem; font-weight:800; color:#ff4757;" id="days">0</div>
                    <div style="font-size:0.7rem; color:#aaa; font-weight:700;">DAYS</div>
                </div>
                <div style="background:white; padding:20px; border-radius:15px;">
                    <div style="font-size:2rem;">🔋</div>
                    <div style="font-size:0.7rem; color:#aaa; font-weight:700;">100% LOVE</div>
                </div>
            </div>
        </div>

        <div id="tab-draw" class="content">
            <div class="hero"><h1>Draw a Heart 🎨</h1><p>For Me</p></div>
            <div class="canvas-container">
                <canvas id="drawArea"></canvas>
            </div>
            <div class="tools">
                <button class="tool-btn btn-clear" onclick="clearCanvas()">Clear</button>
                <button class="tool-btn btn-save" onclick="alert('Saved to my heart! ❤️')">Send to Theshu</button>
            </div>
        </div>

        <div id="tab-chat" class="content">
            <div class="hero"><h1>Chat 💬</h1></div>
            <div class="chat-list" id="msgs">
                <div class="msg them">Hey Ayuuu! ❤️</div>
            </div>
            <div style="margin-top:20px;">
                <button onclick="nextChat()" style="width:100%; padding:15px; background:#ff4757; color:white; border:none; border-radius:15px; font-weight:700;">Reply</button>
            </div>
        </div>

        <div class="nav-bar">
            <div class="nav-item active" onclick="switchTab('home', this)"><div class="nav-icon">🏠</div>Home</div>
            <div class="nav-item" onclick="switchTab('draw', this)"><div class="nav-icon">🎨</div>Draw</div>
            <div class="nav-item" onclick="switchTab('chat', this)"><div class="nav-icon">💬</div>Chat</div>
        </div>

    </div>

    <script>
        // --- LOCK LOGIC ---
        let holdTimer;
        function startUnlock() {
            document.getElementById('scanner').classList.add('scanning');
            // Unlock after 0.8s
            holdTimer = setTimeout(() => {
                if(navigator.vibrate) navigator.vibrate(50);
                document.getElementById('lock').style.transform = 'translateY(-100%)';
            }, 800);
        }
        function stopUnlock() {
            document.getElementById('scanner').classList.remove('scanning');
            clearTimeout(holdTimer);
        }

        // --- NAVIGATION ---
        function switchTab(id, el) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            el.classList.add('active');
        }

        // --- MUSIC ---
        function toggleMusic() {
            const vinyl = document.getElementById('vinyl');
            if (vinyl.classList.contains('playing')) {
                vinyl.classList.remove('playing');
            } else {
                vinyl.classList.add('playing');
            }
        }

        // --- DRAWING CANVAS LOGIC ---
        const canvas = document.getElementById('drawArea');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        // Resize canvas
        function resizeCanvas() {
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#ff4757';
        }
        window.onload = resizeCanvas;

        // Touch Events
        canvas.addEventListener('touchstart', (e) => {
            drawing = true;
            ctx.beginPath();
            const rect = canvas.getBoundingClientRect();
            ctx.moveTo(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
        });
        
        canvas.addEventListener('touchmove', (e) => {
            if(!drawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
            ctx.stroke();
        });

        canvas.addEventListener('touchend', () => drawing = false);

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // --- DATE LOGIC ---
        const start = new Date("2026-01-18");
        const diff = Math.floor((new Date() - start) / (1000 * 60 * 60 * 24));
        document.getElementById('days').innerText = diff > 0 ? diff : 0;

        // --- CHAT LOGIC ---
        let step = 0;
        const msgs = document.getElementById('msgs');
        const script = [
            { me: "Hey Theshu! 👋", them: "I miss you so much. Thinking about Jan 18 makes me smile. ❤️" },
            { me: "Me too! 🥰", them: "Distance is hard, but you are worth it. I have a question..." },
            { me: "What is it? 😮", them: "<b>Will you be my Valentine?</b> Forever? 💍" },
            { me: "YES! Of course! ❤️", them: "I knew it! ❤️ One day I'll put a real ring on your finger. 💍" }
        ];

        function nextChat() {
            if(step >= script.length) return;
            const m = document.createElement('div'); m.className = 'msg me'; m.innerHTML = script[step].me;
            msgs.appendChild(m);
            setTimeout(() => {
                const t = document.createElement('div'); t.className = 'msg them'; t.innerHTML = script[step].them;
                msgs.appendChild(t); step++;
            }, 800);
        }
    </script>
</body>
</html>
