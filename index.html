<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat with Theshu</title>
    <style>
        /* --- 1. SETUP --- */
        :root {
            --bg: #fff;
            --header-bg: rgba(255, 255, 255, 0.95);
            --me-bubble: #ff4757;
            --her-bubble: #e5e5ea;
            --text-me: #fff;
            --text-her: #000;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            margin: 0; padding: 0; width: 100vw; height: 100dvh; 
            background: var(--bg); display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- 2. HEADER --- */
        .chat-header {
            height: 60px; padding: 0 15px; display: flex; align-items: center; gap: 10px;
            background: var(--header-bg); border-bottom: 1px solid #f0f0f0;
            position: fixed; top: 0; width: 100%; z-index: 100; backdrop-filter: blur(10px);
        }
        .avatar {
            width: 40px; height: 40px; border-radius: 50%; background: #ccc;
            background-image: url('https://placehold.co/100x100/ff9a9e/ffffff?text=A'); 
            background-size: cover;
        }
        .info { flex: 1; }
        .name { font-weight: bold; font-size: 1rem; }
        .status { font-size: 0.75rem; color: #2ecc71; } /* Green for Online */
        
        .video-icon { font-size: 1.5rem; color: #ff4757; cursor: pointer; }

        /* --- 3. CHAT AREA --- */
        .chat-area {
            flex: 1; padding: 80px 15px 80px 15px; overflow-y: auto; scroll-behavior: smooth;
            display: flex; flex-direction: column; gap: 10px;
        }
        
        /* Bubbles */
        .msg {
            max-width: 75%; padding: 10px 16px; border-radius: 20px; font-size: 0.95rem; line-height: 1.4;
            position: relative; opacity: 0; transform: translateY(20px); animation: popIn 0.3s forwards;
        }
        
        .me {
            align-self: flex-end; background: var(--me-bubble); color: var(--text-me);
            border-bottom-right-radius: 5px;
        }
        
        .her {
            align-self: flex-start; background: var(--her-bubble); color: var(--text-her);
            border-bottom-left-radius: 5px;
        }

        .typing-indicator {
            align-self: flex-start; background: #e5e5ea; padding: 10px 15px; border-radius: 20px;
            border-bottom-left-radius: 5px; width: fit-content; display: none; margin-bottom: 10px;
        }
        .dot {
            display: inline-block; width: 6px; height: 6px; background: #999; border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both; margin: 0 2px;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        /* --- 4. FOOTER (INPUT) --- */
        .chat-footer {
            height: 70px; padding: 10px 15px; background: #f9f9f9; border-top: 1px solid #eee;
            position: fixed; bottom: 0; width: 100%; display: flex; align-items: center; gap: 10px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
        }
        .fake-input {
            flex: 1; height: 40px; background: white; border-radius: 20px; border: 1px solid #ddd;
            padding: 0 15px; display: flex; align-items: center; color: #aaa; font-size: 0.9rem;
        }
        .send-btn {
            width: 40px; height: 40px; background: var(--me-bubble); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: white; font-size: 1.2rem;
            cursor: pointer; transition: 0.2s;
        }
        .send-btn:active { transform: scale(0.9); }

        /* --- ANIMATIONS --- */
        @keyframes popIn { to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }

    </style>
</head>
<body>

    <div class="chat-header">
        <div class="back-btn" style="color:#ff4757; font-size:1.5rem;">‹</div>
        <div class="avatar"></div>
        <div class="info">
            <div class="name">Ayuuu ❤️</div>
            <div class="status">Online</div>
        </div>
        <div class="video-icon">📹</div>
    </div>

    <div class="chat-area" id="chat">
        <div style="text-align:center; font-size:0.75rem; color:#aaa; margin-bottom:15px;">Today 12:00 PM</div>

        <div class="typing-indicator" id="typing">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
    </div>

    <div class="chat-footer">
        <div class="fake-input" id="input-text">Tap arrow to reply...</div>
        <div class="send-btn" onclick="nextMessage()">➤</div>
    </div>

    <script>
        // --- THE SCRIPT (Customize this!) ---
        // 'me' = Theshu (Pink bubble, right)
        // 'her' = Ayuuu (Gray bubble, left)
        const conversation = [
            { side: 'me', text: "Hey Ayuuu! ❤️" },
            { side: 'her', text: "Hey Theshu! Miss you! 🥰" },
            { side: 'me', text: "I miss you more! I was thinking about us..." },
            { side: 'her', text: "Aww, what about us? 🙈" },
            { side: 'me', text: "Just how happy you make me. You are my favorite person." },
            { side: 'her', text: "You are gonna make me cry! 🥺❤️" },
            { side: 'me', text: "I have a serious question though..." },
            { side: 'her', text: "Omg what is it?? 😮" },
            { side: 'me', text: "<b>Will you be my Valentine?</b> 🌹💍" },
            { side: 'her', text: "YES!! 1000 times YES! 😍❤️" }
        ];

        let step = 0;
        const chatBox = document.getElementById('chat');
        const typingIndicator = document.getElementById('typing');
        const inputText = document.getElementById('input-text');

        function nextMessage() {
            if (step >= conversation.length) return;

            const currentMsg = conversation[step];
            
            // If it's MY turn to speak
            if (currentMsg.side === 'me') {
                addBubble('me', currentMsg.text);
                step++;
                // Check if next is HER turn, then simulate typing
                if (step < conversation.length && conversation[step].side === 'her') {
                    showTyping();
                }
            } 
            // If it's HER turn (Wait for typing)
            else if (currentMsg.side === 'her') {
                // This logic is handled by showTyping's timeout, but if user clicks fast:
                // We prevent clicking while she is "typing" (Optional, but realistic)
            }
            
            updateScroll();
        }

        function addBubble(side, text) {
            const div = document.createElement('div');
            div.className = `msg ${side}`;
            div.innerHTML = text;
            
            // Insert before typing indicator
            chatBox.insertBefore(div, typingIndicator);
            
            // Special effect for final YES
            if(text.includes("YES")) {
                celebrate();
            }
        }

        function showTyping() {
            inputText.innerText = "Ayuuu is typing...";
            typingIndicator.style.display = 'block';
            updateScroll();

            // Simulate delay (1.5 seconds)
            setTimeout(() => {
                typingIndicator.style.display = 'none';
                addBubble('her', conversation[step].text);
                inputText.innerText = "Tap arrow to reply...";
                step++;
                updateScroll();
            }, 1500);
        }

        function updateScroll() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function celebrate() {
            // Confetti Explosion
            for(let i=0; i<50; i++) {
                const c = document.createElement('div');
                c.innerHTML = Math.random() > 0.5 ? '❤️' : '🌹';
                c.style.position = 'fixed';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.top = '-20px';
                c.style.fontSize = Math.random() * 20 + 10 + 'px';
                c.style.animation = `fall ${Math.random() * 2 + 2}s linear forwards`;
                document.body.appendChild(c);
            }
            // Auto Style Injection
            const style = document.createElement('style');
            style.innerHTML = `@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }`;
            document.head.appendChild(style);
        }
        
        // Auto-start the conversation (Optional)
        // setTimeout(nextMessage, 1000); 

    </script>
</body>
</html>
