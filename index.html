<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffe6e6;
            font-family: 'Arial', sans-serif;
            text-align: center;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        h1 {
            color: #d63384;
            font-size: 2.5rem;
        }
        p {
            color: #555;
            font-size: 1.2rem;
            line-height: 1.6;
        }
        .heart {
            font-size: 5rem;
            color: #ff4d4d;
            animation: beat 1s infinite alternate;
        }
        @keyframes beat {
            to { transform: scale(1.1); }
        }
        .btn {
            background-color: #d63384;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { background-color: #b02a6b; }
    </style>
</head>
<body>

    <div class="container">
        <div class="heart">❤️</div>
        <h1>Happy Valentine's Day!</h1>
        <p>To the most special person in my life.</p>
        <p>Here is to another year of memories.</p>
        <a href="#" class="btn" onclick="alert('I love you! ❤️')">Click Me</a>
    </div>

</body>
</html>
