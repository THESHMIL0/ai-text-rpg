<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffccd5">
    <title>Ayuuu LovePhone</title>
    <style>
        /* --- 1. THEME VARIABLES --- */
        :root {
            --bg: #ffccd5;
            --wallpaper: linear-gradient(180deg, #ffdde1 0%, #ee9ca7 100%);
            --glass: rgba(255, 255, 255, 0.45);
            --primary: #ff4757;
            --text-dark: #5e3a43;
        }

        /* --- 2. RESET --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        body { margin: 0; padding: 0; width: 100vw; height: 100dvh; background: var(--bg); overflow: hidden; position: fixed; color: var(--text-dark); }

        /* --- 3. BACKGROUND --- */
        .wallpaper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--wallpaper); z-index: 0;
        }
        .falling-hearts { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1; }
        .heart { position: absolute; top: -20px; animation: fall linear infinite; }

        /* --- 4. LOCK SCREEN --- */
        #lock-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 500;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 120px;
            backdrop-filter: blur(5px); background: rgba(255,255,255,0.1);
            transition: 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .clock-huge { font-size: 5rem; font-weight: 200; color: white; line-height: 1; text-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .date { color: white; font-size: 1.2rem; font-weight: 600; margin-top: 10px; }
        .swipe-hint { position: absolute; bottom: 50px; color: white; animation: bounce 2s infinite; font-weight: bold; }

        /* --- 5. HOME SCREEN --- */
        #home-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            padding: 90px 25px 120px 25px; display: flex; flex-direction: column;
            opacity: 0; transition: 0.5s; transform: scale(1.1);
        }
        body.unlocked #home-screen { opacity: 1; transform: scale(1); }

        /* Widgets */
        .widget-row { display: flex; gap: 15px; width: 100%; height: 140px; margin-bottom: 30px; }
        .widget {
            flex: 1; background: var(--glass); border-radius: 20px; padding: 15px;
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.1);
            display: flex; flex-direction: column; justify-content: space-between;
            border: 1px solid rgba(255,255,255,0.6);
        }

        /* App Icons */
        .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 10px; }
        .app { display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; transition: 0.2s; }
        .app:active { transform: scale(0.9); }
        .icon {
            width: 60px; height: 60px; border-radius: 18px; font-size: 28px;
            display: flex; align-items: center; justify-content: center;
            background: white; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .app-name { font-size: 11px; font-weight: 600; }

        /* Dock */
        .dock {
            position: absolute; bottom: 25px; left: 20px; right: 20px; height: 90px;
            background: rgba(255,255,255,0.6); border-radius: 30px; backdrop-filter: blur(20px);
            display: flex; justify-content: space-around; align-items: center; z-index: 20;
        }

        /* --- 6. APP WINDOWS --- */
        .app-window {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff0f3; z-index: 2000; transform: scale(0.8); opacity: 0; pointer-events: none;
            transition: 0.4s cubic-bezier(0.32, 0.72, 0, 1); border-radius: 40px; overflow: hidden;
        }
        .app-window.active { transform: scale(1); opacity: 1; pointer-events: auto; border-radius: 0; }
        
        .nav-bar {
            height: 90px; padding: 40px 20px 10px 20px; background: rgba(255,255,255,0.95);
            border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.1rem; position: relative; color: var(--primary);
        }
        .back-btn { position: absolute; left: 20px; font-size: 1rem; cursor: pointer; color: #007aff; }
        .app-content { height: calc(100% - 90px); overflow-y: auto; padding: 15px; padding-bottom: 80px; }

        /* --- 7. CHAT APP SPECIFIC --- */
        .chat-area { display: flex; flex-direction: column; gap: 10px; }
        .bubble { max-width: 80%; padding: 10px 15px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; animation: popIn 0.3s; }
        .her { align-self: flex-start; background: #e5e5ea; color: black; border-bottom-left-radius: 5px; }
        .me { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 5px; }
        
        .chat-input-bar {
            position: absolute; bottom: 0; width: 100%; height: 70px; background: #f9f9f9;
            display: flex; align-items: center; padding: 0 15px; gap: 10px;
        }
        .input-fake { flex: 1; height: 40px; border: 1px solid #ddd; border-radius: 20px; background: white; padding-left: 15px; display: flex; align-items: center; color: #aaa; font-size: 0.9rem; }
        .send-btn { width: 40px; height: 40px; background: var(--primary); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        .typing { font-size: 0.8rem; color: #888; margin-left: 10px; display: none; }

        /* --- 8. UTILS --- */
        .home-bar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 130px; height: 5px; background: rgba(0,0,0,0.2); border-radius: 10px; z-index: 9999; }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        @keyframes popIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    </style>
</head>
<body onload="init()">

    <div class="wallpaper"></div>
    <div class="falling-hearts" id="hearts-bg"></div>

    <div id="lock-screen" onclick="unlock()">
        <div style="font-size:2rem; margin-bottom:10px;">🔒</div>
        <div class="clock-huge" id="clock">12:00</div>
        <div class="date" id="date">Sunday, 14 February</div>
        <div class="swipe-hint">Tap to Unlock ❤️</div>
        <div class="home-bar" style="background: white;"></div>
    </div>

    <div id="home-screen">
        <div class="widget-row">
            <div class="widget">
                <div style="font-size:0.7rem; font-weight:700; color:#888;">TOGETHER</div>
                <div style="font-size:2.5rem; font-weight:800; color:var(--primary);" id="days">0</div>
                <div style="font-size:0.7rem; font-weight:700; color:#888;">DAYS</div>
            </div>
            <div class="widget" style="background: linear-gradient(135deg, #ff9a9e, #ff6b81); color:white;">
                <div style="font-size:0.7rem; font-weight:700; opacity:0.9;">BATTERY</div>
                <div style="font-size:2rem;">100%</div>
                <div style="font-size:0.7rem;">Love Charged</div>
            </div>
        </div>

        <div class="app-grid">
            <div class="app" onclick="openApp('app-calc')">
                <div class="icon" style="background:#ff9f43; color:white;">🧮</div>
                <div class="app-name">LuvCalc</div>
            </div>
            <div class="app" onclick="openApp('app-photos')">
                <div class="icon" style="background:white;">📸</div>
                <div class="app-name">Photos</div>
            </div>
            <div class="app" onclick="openApp('app-notes')">
                <div class="icon" style="background:#ffdd59; color:white;">📒</div>
                <div class="app-name">Diary</div>
            </div>
            <div class="app" onclick="location.reload()">
                <div class="icon" style="background:#333; color:white;">↺</div>
                <div class="app-name">Reset</div>
            </div>
        </div>

        <div class="dock">
            <div class="app"><div class="icon" style="background:#2ed573; color:white;">📞</div></div>
            <div class="app" onclick="openApp('app-msg')"><div class="icon" style="background:#ff4757; color:white;">💬</div></div>
            <div class="app" onclick="toggleMusic()"><div class="icon" style="background:#1e90ff; color:white;">🎵</div></div>
        </div>
        
        <div class="home-bar"></div>
    </div>

    <audio id="bgMusic" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

    <div class="app-window" id="app-msg">
        <div class="nav-bar">
            <div class="back-btn" onclick="closeApp('app-msg')">‹ Home</div>
            <div>
                <div>Ayuuu ❤️</div>
                <div style="font-size:0.7rem; color:#aaa; font-weight:normal;">Online</div>
            </div>
        </div>
        
        <div class="app-content" id="chat-history">
            <div style="text-align:center; color:#ccc; font-size:0.8rem; margin-bottom:15px;">Today 12:00 PM</div>
            <div class="typing" id="typing-indicator">Ayuuu is typing...</div>
        </div>

        <div class="chat-input-bar">
            <div class="input-fake" id="chat-input-text">Tap arrow to start...</div>
            <div class="send-btn" onclick="nextChatStep()">➤</div>
        </div>
        
        <div class="home-bar"></div>
    </div>

    <div class="app-window" id="app-photos">
        <div class="nav-bar"><div class="back-btn" onclick="closeApp('app-photos')">‹ Home</div>Gallery</div>
        <div class="app-content">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div style="height:150px; background:#ddd; border-radius:10px; background-size:cover; background-image:url('https://placehold.co/200x200/ffcccc/ff4757?text=Us');"></div>
                <div style="height:150px; background:#ddd; border-radius:10px; background-size:cover; background-image:url('https://placehold.co/200x200/ffcccc/ff4757?text=Cute');"></div>
                <div style="height:150px; background:#ddd; border-radius:10px; background-size:cover; background-image:url('https://placehold.co/200x200/ffcccc/ff4757?text=Love');"></div>
                <div style="height:150px; background:#ddd; border-radius:10px; background-size:cover; background-image:url('https://placehold.co/200x200/ffcccc/ff4757?text=Date');"></div>
            </div>
        </div>
        <div class="home-bar" onclick="closeApp('app-photos')"></div>
    </div>

    <div class="app-window" id="app-notes">
        <div class="nav-bar"><div class="back-btn" onclick="closeApp('app-notes')">‹ Home</div>Diary</div>
        <div class="app-content" style="background:#fff9c4;">
             <textarea style="width:100%; height:100%; background:transparent; border:none; outline:none; font-size:1.1rem; font-family:'Courier New', cursive;" placeholder="Write a note to Ayuuu..."></textarea>
        </div>
        <div class="home-bar" onclick="closeApp('app-notes')"></div>
    </div>

    <div class="app-window" id="app-calc">
        <div class="nav-bar"><div class="back-btn" onclick="closeApp('app-calc')">‹ Home</div>LoveCalc</div>
        <div class="app-content" style="display:flex; justify-content:center; align-items:center;">
            <div style="background:white; padding:30px; border-radius:20px; text-align:center; width:100%; box-shadow:0 10px 30px rgba(0,0,0,0.1);">
                <h2>Theshu + Ayuuu</h2>
                <h1 style="color:var(--primary); font-size:3rem;">= 100%</h1>
            </div>
        </div>
        <div class="home-bar" onclick="closeApp('app-calc')"></div>
    </div>

    <script>
        // --- 1. SYSTEM INIT ---
        function init() {
            // Clock
            setInterval(() => {
                const d = new Date();
                const t = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                document.getElementById('clock').innerText = t;
                document.getElementById('date').innerText = d.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});
            }, 1000);

            // Days Widget
            const diff = Math.floor((new Date() - new Date("2026-01-18")) / (1000 * 60 * 60 * 24));
            document.getElementById('days').innerText = diff > 0 ? diff : 0;

            // Falling Hearts
            setInterval(createHeart, 600);
        }

        // --- 2. PHONE NAVIGATION ---
        function unlock() {
            document.getElementById('lock-screen').style.transform = 'translateY(-100%)';
            document.body.classList.add('unlocked');
        }
        function openApp(id) { document.getElementById(id).classList.add('active'); }
        function closeApp(id) { document.getElementById(id).classList.remove('active'); }

        // --- 3. CHAT LOGIC (The New Update!) ---
        const script = [
            { sender: 'me', text: "Hey Ayuuu! ❤️" },
            { sender: 'her', text: "Hey Theshu! Miss you! 🥰" },
            { sender: 'me', text: "I made this app just for you." },
            { sender: 'her', text: "Omg really? It's so cute! 🥺" },
            { sender: 'me', text: "I have a question..." },
            { sender: 'her', text: "What is it? 👀" },
            { sender: 'me', text: "<b>Will you be my Valentine?</b> 🌹💍" },
            { sender: 'her', text: "YES!! Of course! ❤️😍" }
        ];
        let chatStep = 0;
        const chatBox = document.getElementById('chat-history');
        const typing = document.getElementById('typing-indicator');
        const input = document.getElementById('chat-input-text');

        function nextChatStep() {
            if(chatStep >= script.length) return;

            const msg = script[chatStep];
            
            // My Turn
            if(msg.sender === 'me') {
                addMessage('me', msg.text);
                chatStep++;
                input.innerText = "Waiting for reply...";
                
                // Trigger Her Reply
                if(chatStep < script.length) {
                    setTimeout(() => {
                        typing.style.display = 'block';
                        chatBox.scrollTop = chatBox.scrollHeight;
                        setTimeout(() => {
                            typing.style.display = 'none';
                            addMessage('her', script[chatStep].text);
                            chatStep++;
                            input.innerText = "Tap arrow to reply...";
                        }, 1500);
                    }, 500);
                }
            }
        }

        function addMessage(sender, text) {
            const div = document.createElement('div');
            div.className = `bubble ${sender}`;
            div.innerHTML = text;
            chatBox.insertBefore(div, typing);
            chatBox.scrollTop = chatBox.scrollHeight;

            if(text.includes("YES!!")) {
                for(let i=0; i<50; i++) setTimeout(createHeart, i*50); // Explosion
                input.innerText = "Chat Ended ❤️";
            }
        }

        // --- 4. EXTRAS ---
        function createHeart() {
            const h = document.createElement('div');
            h.innerText = Math.random()>0.5 ? '❤️' : '🌸';
            h.classList.add('heart');
            h.style.left = Math.random() * 100 + 'vw';
            h.style.animationDuration = Math.random() * 3 + 3 + 's';
            h.style.fontSize = Math.random() * 10 + 10 + 'px';
            h.style.opacity = Math.random();
            document.querySelector('.falling-hearts').appendChild(h);
            setTimeout(() => h.remove(), 6000);
        }

        const audio = document.getElementById('bgMusic');
        let playing = false;
        function toggleMusic() {
            if(!playing) { audio.play(); alert("Playing Music 🎵"); }
            else { audio.pause(); }
            playing = !playing;
        }

    </script>
</body>
</html>
