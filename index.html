<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Ayushka ❤️</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --primary: #ff4757;
            --glass: rgba(255, 255, 255, 0.7);
        }
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            color: #2f3542;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* GLASS CARD */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        /* LOCK SCREEN */
        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255,255,255,0.4);
            backdrop-filter: blur(20px);
            transition: opacity 0.6s ease-out;
        }

        /* MAIN APP */
        .container {
            padding: 2.5rem;
            max-width: 90%;
            width: 420px;
            text-align: center;
            display: none;
            margin-bottom: 80px; /* Space for music player */
            animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        h1 { font-family: 'Dancing Script', cursive; color: var(--primary); font-size: 3rem; margin: 0; }
        
        /* INPUTS & BUTTONS */
        input {
            width: 100%; padding: 15px; margin-top: 15px;
            border: 2px solid white; background: rgba(255,255,255,0.5);
            border-radius: 15px; outline: none; text-align: center; font-size: 1.1rem;
        }
        
        .btn {
            background: linear-gradient(135deg, #ff6b6b, #ff4757);
            color: white; border: none; padding: 14px 25px;
            border-radius: 50px; font-size: 1rem; font-weight: 600;
            cursor: pointer; margin: 10px 0; width: 100%;
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.3);
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { background: #ccc; cursor: not-allowed; box-shadow: none; }

        /* MOOD GRID */
        .mood-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 25px 0; }
        .mood-btn {
            background: rgba(255,255,255,0.6); border: none; padding: 20px;
            border-radius: 20px; cursor: pointer; transition: 0.3s;
        }
        .mood-btn:hover { background: white; transform: translateY(-3px); }

        /* QUIZ MODAL */
        .quiz-option {
            background: #eee; padding: 10px; margin: 5px 0;
            border-radius: 10px; cursor: pointer; transition: 0.2s;
        }
        .quiz-option:hover { background: #d63384; color: white; }

        /* MUSIC PLAYER BAR */
        .music-player {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex; align-items: center; justify-content: space-between;
            z-index: 100;
        }
        .playing-icon {
            width: 20px; height: 20px;
            display: flex; gap: 3px; align-items: flex-end;
        }
        .bar {
            width: 4px; background: var(--primary);
            animation: dance 0.5s infinite alternate;
        }
        .bar:nth-child(2) { animation-delay: 0.1s; }
        .bar:nth-child(3) { animation-delay: 0.2s; }
        @keyframes dance { from { height: 5px; } to { height: 20px; } }

        /* MODAL */
        #message-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(5px);
            z-index: 3000; justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; padding: 30px; border-radius: 30px;
            max-width: 85%; width: 350px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            animation: popIn 0.3s ease;
        }
        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* FLOATING EMOJIS */
        .floating-emoji { position: fixed; pointer-events: none; z-index: 9999; }
        @keyframes floatUp { to { transform: translateY(-100vh) rotate(360deg); opacity: 0; } }

    </style>
</head>
<body>

    <div id="login-screen" class="glass-card">
        <div style="padding: 2rem; width: 100%; max-width: 400px; text-align: center;">
            <h1>Locked 🔒</h1>
            <p>Access restricted to my favorite person.</p>
            <input type="text" id="password-input" placeholder="Enter your name..." autocomplete="off">
            <button class="btn" style="margin-top: 20px;" onclick="checkPassword()">Unlock Access</button>
            <p id="error-msg" style="color:#ff4757; display:none; margin-top:10px;">Hint: Ayushka</p>
        </div>
    </div>

    <div class="container glass-card" id="main-content">
        <h1>Hey Ayushka!</h1>
        <p>I built this little corner of the internet just for you.</p>

        <button class="btn" onclick="sendKiss()">💋 Send a Flying Kiss</button>

        <div class="mood-grid">
            <button class="mood-btn" onclick="openMessage('miss')">💌<br>Miss You</button>
            <button class="mood-btn" onclick="openMessage('sad')">🧸<br>Sad</button>
            <button class="mood-btn" onclick="openMessage('happy')">✨<br>Happy</button>
            <button class="mood-btn" onclick="openMessage('us')">🔒<br>Future</button>
        </div>

        <div style="background: white; padding: 20px; border-radius: 20px; margin: 20px 0; box-shadow: 0 5px 15px rgba(0,0,0,0.05);">
            <div id="gift-lock-view">
                <div style="font-size: 3rem;">🎁</div>
                <h3>The Mystery Box</h3>
                <p style="font-size: 0.8rem; color: #888;">Complete the Love Quiz to unlock!</p>
                <button class="btn" style="background: #2f3542;" onclick="startQuiz()">Start Quiz 🧠</button>
            </div>
            
            <div id="gift-unlocked-view" style="display:none; animation: popIn 0.5s;">
                <div style="font-size: 3rem;">💍</div>
                <h3 style="color: var(--primary);">It's a Promise Ring!</h3>
                <small>One day, this will be real.</small>
            </div>
        </div>

        <button class="btn" id="danger-btn" style="background: #ff4757; margin-top: 30px;" onclick="triggerExplosion()">🚫 DO NOT PRESS</button>

    </div>

    <div class="music-player" id="music-bar" style="display:none;">
        <div style="display: flex; align-items: center; gap: 10px;">
            <div style="background: #eee; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">🎵</div>
            <div style="text-align: left;">
                <div style="font-weight: bold; font-size: 0.9rem;">Our Song</div>
                <div style="font-size: 0.7rem; color: #888;">Playing in your heart...</div>
            </div>
        </div>
        <div class="playing-icon">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
    </div>

    <div id="message-modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div id="modal-content-body"></div> <button class="btn" onclick="closeModal()" style="margin-top: 20px; width: auto;">Close</button>
        </div>
    </div>

    <script>
        const password = "Ayushka"; 
        
        // --- QUIZ DATA (CUSTOMIZE THESE!) ---
        const quizData = [
            { q: "What is my favorite color?", a: ["Red", "Black", "Blue"], correct: 1 }, // 0 is Red, 1 is Black, 2 is Blue
            { q: "Where did we meet (in the future)?", a: ["Paris", "Airport", "Dreamland"], correct: 1 },
            { q: "Who loves the other person more?", a: ["Me", "You", "Equal"], correct: 0 } 
        ];
        let currentQuizIndex = 0;

        // 1. LOCK SCREEN
        function checkPassword() {
            const input = document.getElementById("password-input").value;
            if (input.toLowerCase() === password.toLowerCase()) {
                document.getElementById("login-screen").style.opacity = "0";
                setTimeout(() => {
                    document.getElementById("login-screen").style.display = "none";
                    document.getElementById("main-content").style.display = "block";
                    document.getElementById("music-bar").style.display = "flex"; // Show player
                }, 600);
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }

        // 2. QUIZ LOGIC
        function startQuiz() {
            currentQuizIndex = 0;
            showQuizQuestion();
        }

        function showQuizQuestion() {
            const q = quizData[currentQuizIndex];
            let html = `<h3 style="color:var(--primary)">Question ${currentQuizIndex + 1}</h3><p>${q.q}</p>`;
            q.a.forEach((opt, index) => {
                html += `<div class="quiz-option" onclick="checkAnswer(${index})">${opt}</div>`;
            });
            showModal(html);
        }

        function checkAnswer(selectedIndex) {
            if (selectedIndex === quizData[currentQuizIndex].correct) {
                currentQuizIndex++;
                if (currentQuizIndex < quizData.length) {
                    showQuizQuestion(); // Next question
                } else {
                    closeModal();
                    triggerConfetti();
                    document.getElementById("gift-lock-view").style.display = "none";
                    document.getElementById("gift-unlocked-view").style.display = "block";
                }
            } else {
                alert("Wrong answer! 😱 Do you even know me? Try again!");
            }
        }

        // 3. EXPLOSION FIX (LAG FREE)
        let isExploding = false; // Flag to prevent multiple clicks
        function triggerExplosion() {
            if (isExploding) return; // Stop if already running
            isExploding = true;
            
            const btn = document.getElementById("danger-btn");
            btn.innerText = "I TOLD YOU! 💥";
            btn.disabled = true;

            let count = 0;
            const interval = setInterval(() => {
                createEmoji(["💣", "💥", "❤️"][Math.floor(Math.random()*3)]);
                count++;
                if (count > 30) { // Stop after 30 emojis
                    clearInterval(interval);
                    isExploding = false;
                    btn.innerText = "🚫 DO NOT PRESS";
                    btn.disabled = false;
                }
            }, 100);
        }

        // 4. OPEN WHEN MESSAGES
        const messages = {
            'miss': { emoji: "🌏", title: "Missing You", text: "Look at the moon. I'm looking at it too." },
            'sad': { emoji: "🫂", title: "Don't be Sad", text: "I am sending you a massive virtual hug right now." },
            'happy': { emoji: "✨", title: "Yay!", text: "Keep that smile on your face, it suits you." },
            'us': { emoji: "🔒", title: "Our Future", text: "Worth every mile, worth every second." }
        };

        function openMessage(type) {
            const data = messages[type];
            showModal(`<div style="font-size:3rem">${data.emoji}</div><h3>${data.title}</h3><p>${data.text}</p>`);
        }

        // HELPER FUNCTIONS
        function showModal(content) {
            document.getElementById("modal-content-body").innerHTML = content;
            document.getElementById("message-modal").style.display = "flex";
        }
        function closeModal() { document.getElementById("message-modal").style.display = "none"; }

        function sendKiss() {
            createEmoji("💋");
        }

        function createEmoji(char) {
            const el = document.createElement("div");
            el.innerText = char;
            el.classList.add("floating-emoji");
            el.style.left = Math.random() * 80 + 10 + "vw"; // Keep within screen width
            el.style.top = "100vh";
            el.style.fontSize = (Math.random() * 2 + 1.5) + "rem";
            el.style.animation = "floatUp 3s linear forwards"; 
            document.body.appendChild(el);
            
            // Auto remove after animation finishes to prevent lag
            setTimeout(() => { el.remove(); }, 3000); 
        }

        function triggerConfetti() {
            for(let i=0; i<30; i++) {
                setTimeout(() => createEmoji("🎉"), i * 50);
            }
        }
    </script>
</body>
</html>
