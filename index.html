<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#fff5f7">
    <title>Theshu ❤️ Ayuuu</title>
    <style>
        /* --- VARIABLES --- */
        :root { 
            --primary: #ff4757; 
            --bg: #fff5f7; 
            --card-bg: #ffffff;
            --text: #2f3542; 
            --glass: rgba(255, 255, 255, 0.95); 
            --shadow: rgba(0,0,0,0.05);
        }

        /* --- DARK MODE VARIABLES --- */
        body.dark-mode {
            --bg: #1e272e;
            --card-bg: #2f3640;
            --text: #f1f2f6;
            --glass: rgba(30, 39, 46, 0.95);
            --shadow: rgba(0,0,0,0.3);
        }

        /* --- RESET --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; user-select: none; transition: background 0.3s, color 0.3s; }
        body { margin: 0; padding: 0; width: 100vw; height: 100dvh; background: var(--bg); color: var(--text); overflow: hidden; position: relative; }

        /* --- BACKGROUND ANIMATIONS --- */
        .bg-hearts { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .heart-float { position: absolute; bottom: -20px; animation: floatUp 8s linear forwards; font-size: 20px; opacity: 0.6; }
        
        /* Dark Mode Stars */
        .stars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
        body.dark-mode .stars { display: block; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle 2s infinite ease-in-out; }

        /* --- THEME TOGGLE (NEW) --- */
        .theme-switch {
            position: absolute; top: 20px; right: 20px; z-index: 100;
            background: var(--card-bg); padding: 10px; border-radius: 50%;
            box-shadow: 0 5px 15px var(--shadow); cursor: pointer; font-size: 1.5rem;
        }

        /* --- LOCK SCREEN --- */
        #lock {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #ff9a9e 0%, #ff6b81 100%);
            z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; transition: transform 0.6s cubic-bezier(0.7, 0, 0.3, 1);
        }
        .scanner { width: 90px; height: 90px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); backdrop-filter: blur(5px); }
        .fingerprint { font-size: 3rem; transition: 0.3s; }
        .scanner.scanning .fingerprint { transform: scale(0.9); opacity: 0.8; }

        /* --- LAYOUT --- */
        .app-container { display: flex; flex-direction: column; height: 100%; position: relative; z-index: 10; }
        .content { flex: 1; overflow-y: auto; padding: 25px; display: none; padding-bottom: 120px; scroll-behavior: smooth; }
        .content.active { display: block; animation: fadeIn 0.4s ease-out; }
        .card { background: var(--card-bg); border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 20px var(--shadow); }

        /* --- FEATURE: DIARY (NEW) --- */
        textarea {
            width: 100%; height: 150px; border: 2px dashed #ccc; border-radius: 15px; padding: 15px;
            font-size: 1rem; margin-bottom: 15px; background: transparent; color: var(--text); resize: none;
        }
        .btn-save { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 50px; font-weight: bold; width: 100%; }

        /* --- FEATURE: FORTUNE COOKIE (NEW) --- */
        .cookie-container { position: relative; height: 200px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .cookie { font-size: 6rem; transition: 0.5s; }
        .cookie.cracked { transform: scale(1.1) rotate(10deg); opacity: 0; }
        .fortune-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            background: white; padding: 15px; border-radius: 10px; width: 80%; text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2); transition: 0.5s; z-index: 5; color: #333;
        }
        .fortune-msg.show { transform: translate(-50%, -50%) scale(1); }

        /* --- MOOD & GAMES (KEPT) --- */
        .mood-grid { display: flex; justify-content: space-between; margin-top: 15px; }
        .mood-btn { font-size: 2rem; background: rgba(0,0,0,0.05); border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; }
        .mood-btn.selected { transform: scale(1.2); background: var(--primary); }

        /* --- NAV BAR --- */
        .nav-bar {
            height: 75px; background: var(--glass); position: fixed; bottom: 0; left: 0; width: 100%;
            display: flex; justify-content: space-around; align-items: center; padding-bottom: 15px; 
            border-radius: 25px 25px 0 0; box-shadow: 0 -5px 30px var(--shadow); z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #ccc; font-size: 0.7rem; font-weight: 700; transition: 0.3s; }
        .nav-item.active { color: var(--primary); transform: translateY(-5px); }
        .nav-icon { font-size: 1.5rem; margin-bottom: 4px; }

        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 0.8; } 100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <div class="bg-hearts" id="bgHearts"></div>
    <div class="stars" id="stars"></div>

    <div id="lock" onmousedown="startUnlock()" onmouseup="stopUnlock()" ontouchstart="startUnlock()" ontouchend="stopUnlock()">
        <div class="scanner" id="scanner"><div class="fingerprint">❤️</div></div>
        <p style="opacity: 0.8; font-size: 0.9rem;">Touch & Hold ID</p>
    </div>

    <div class="app-container">
        
        <div class="theme-switch" onclick="toggleTheme()" id="themeIcon">🌙</div>

        <div id="tab-home" class="content active">
            <h1 style="font-size: 2.2rem; margin:10px 0;">My <span style="color:var(--primary);">Ayuuu</span> ❤️</h1>
            
            <div class="card" style="display:flex; justify-content:space-between; align-items:center; background: linear-gradient(135deg, #ff9a9e 0%, #ff6b81 100%); color:white;">
                <div>
                    <div style="font-size:2.5rem; font-weight:800;" id="days">0</div>
                    <div style="font-size:0.8rem; font-weight:700;">DAYS TOGETHER</div>
                </div>
                <div style="font-size:2.5rem;">📅</div>
            </div>

            <div class="card">
                <h3 style="margin:0;">Mood Check 🌡️</h3>
                <div class="mood-grid">
                    <div class="mood-btn" onclick="setMood(this)">😄</div>
                    <div class="mood-btn" onclick="setMood(this)">🥰</div>
                    <div class="mood-btn" onclick="setMood(this)">😴</div>
                    <div class="mood-btn" onclick="setMood(this)">😢</div>
                </div>
            </div>
            
            <div class="card" style="text-align:center;">
                <h3>Fortune Cookie 🥠</h3>
                <p style="color:#888; font-size:0.8rem;">Tap to reveal your destiny!</p>
                <div class="cookie-container" onclick="crackCookie()">
                    <div class="cookie" id="cookieEmoji">🥠</div>
                    <div class="fortune-msg" id="fortuneMsg">
                        <p id="fortuneText" style="font-weight:bold; margin-bottom:5px;">Love is coming.</p>
                        <small style="color:#888;">(Tap to close)</small>
                    </div>
                </div>
            </div>
        </div>

        <div id="tab-diary" class="content">
            <h1 style="color:var(--primary);">Our Diary 📔</h1>
            <p>Write something for us. It saves automatically!</p>
            
            <div class="card">
                <textarea id="diaryInput" placeholder="Dear Diary, today I thought about..."></textarea>
                <button class="btn-save" onclick="saveDiary()">Save Note 💾</button>
                <p id="saveStatus" style="text-align:center; color:#2ed573; margin-top:10px; opacity:0; transition:0.3s;">Saved!</p>
            </div>
            
            <div class="card">
                <h3>Last Note:</h3>
                <p id="savedNote" style="font-style:italic; color:#888;">No notes yet...</p>
            </div>
        </div>

        <div class="nav-bar">
            <div class="nav-item active" onclick="switchTab('home', this)"><span class="nav-icon">🏠</span>Home</div>
            <div class="nav-item" onclick="switchTab('diary', this)"><span class="nav-icon">📔</span>Diary</div>
        </div>

    </div>

    <script>
        // --- LOCK SCREEN ---
        let holdTimer;
        function startUnlock() {
            document.getElementById('scanner').classList.add('scanning');
            holdTimer = setTimeout(() => {
                if(navigator.vibrate) navigator.vibrate(50);
                document.getElementById('lock').style.transform = 'translateY(-100%)';
            }, 800);
        }
        function stopUnlock() {
            document.getElementById('scanner').classList.remove('scanning');
            clearTimeout(holdTimer);
        }

        // --- NAVIGATION ---
        function switchTab(id, el) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            el.classList.add('active');
        }

        // --- DARK MODE LOGIC (NEW) ---
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const icon = document.getElementById('themeIcon');
            if(document.body.classList.contains('dark-mode')) {
                icon.innerText = '☀️';
            } else {
                icon.innerText = '🌙';
            }
        }
        
        // Generate Stars for Dark Mode
        for(let i=0; i<50; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.top = Math.random()*100+'%';
            s.style.left = Math.random()*100+'%';
            s.style.width = Math.random()*3+'px';
            s.style.height = s.style.width;
            s.style.animationDelay = Math.random()*2+'s';
            document.getElementById('stars').appendChild(s);
        }

        // --- DIARY SAVING (NEW) ---
        // Load saved note on startup
        const savedTxt = localStorage.getItem('loveDiary');
        if(savedTxt) {
            document.getElementById('diaryInput').value = savedTxt;
            document.getElementById('savedNote').innerText = savedTxt;
        }

        function saveDiary() {
            const txt = document.getElementById('diaryInput').value;
            localStorage.setItem('loveDiary', txt); // Saves to phone memory
            document.getElementById('savedNote').innerText = txt;
            
            const status = document.getElementById('saveStatus');
            status.style.opacity = '1';
            setTimeout(() => status.style.opacity = '0', 2000);
        }

        // --- FORTUNE COOKIE (NEW) ---
        const fortunes = [
            "You will receive a surprise hug soon.",
            "Your love is stronger than distance.",
            "Something romantic is about to happen.",
            "You look beautiful today!",
            "Call Theshu, he misses you."
        ];
        
        function crackCookie() {
            const cookie = document.getElementById('cookieEmoji');
            const msgBox = document.getElementById('fortuneMsg');
            const text = document.getElementById('fortuneText');
            
            if(cookie.style.opacity === '0') {
                // Reset
                cookie.style.opacity = '1';
                cookie.style.transform = 'scale(1) rotate(0)';
                msgBox.classList.remove('show');
            } else {
                // Crack
                cookie.style.transform = 'scale(1.2) rotate(20deg)';
                setTimeout(() => {
                    cookie.style.opacity = '0';
                    text.innerText = fortunes[Math.floor(Math.random() * fortunes.length)];
                    msgBox.classList.add('show');
                    createConfetti();
                }, 300);
            }
        }

        // --- DAYS ---
        const diff = Math.floor((new Date() - new Date("2026-01-18")) / (1000 * 60 * 60 * 24));
        document.getElementById('days').innerText = diff > 0 ? diff : 0;

        // --- MOOD ---
        function setMood(el) {
            document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
        }

        // --- BG HEARTS ---
        setInterval(() => {
            const h = document.createElement('div'); h.className = 'heart-float'; h.innerText = Math.random()>0.5?'❤️':'💖'; 
            h.style.left=Math.random()*100+'vw'; h.style.animationDuration=Math.random()*3+4+'s';
            document.getElementById('bgHearts').appendChild(h); setTimeout(()=>h.remove(),8000);
        }, 800);

        function createConfetti() {
            for(let i=0; i<30; i++) {
                const h = document.createElement('div'); h.className = 'heart-float'; h.innerText = '✨'; 
                h.style.left=Math.random()*100+'vw'; h.style.animationDuration=Math.random()*2+'s';
                document.body.appendChild(h); setTimeout(()=>h.remove(),2000);
            }
        }

    </script>
</body>
</html>
