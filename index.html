<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#fff0f5">
    <title>Theshu ❤️ Ayuuu</title>
    <style>
        /* --- CLEAN & LITE CSS --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            margin: 0; padding: 0; width: 100vw; height: 100dvh;
            background: #fff0f5; /* Solid light pink - Fast rendering */
            color: #333; overflow: hidden; position: fixed;
        }

        /* --- LAYOUT --- */
        .full-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; background: #fff0f5;
            transition: transform 0.3s ease; z-index: 10;
        }
        .hidden { display: none !important; }

        /* --- LOCK SCREEN --- */
        #lock { 
            z-index: 50; background: linear-gradient(135deg, #ff9a9e 0%, #ffdde1 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; text-align: center;
        }
        .clock { font-size: 4.5rem; font-weight: 200; margin-bottom: 10px; }
        .notif { 
            background: rgba(255,255,255,0.9); color: #333; padding: 15px 20px; 
            border-radius: 15px; width: 85%; margin-top: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: left;
        }

        /* --- HOME SCREEN --- */
        .home-content { padding: 40px 20px; flex: 1; display: flex; flex-direction: column; }
        
        .header h1 { font-size: 2.5rem; color: #ff4757; margin: 0; }
        .header p { color: #ff8fa3; font-weight: 600; margin-top: 5px; }

        /* Big Widget */
        .card { 
            background: white; border-radius: 20px; padding: 20px; 
            margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex; align-items: center; justify-content: space-between;
        }
        .count-num { font-size: 2.5rem; font-weight: 800; color: #ff4757; }
        
        /* App Grid */
        .apps { 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; 
            margin-top: auto; margin-bottom: 20px;
        }
        .icon-btn { display: flex; flex-direction: column; align-items: center; }
        .icon { 
            width: 60px; height: 60px; background: white; border-radius: 18px; 
            display: flex; align-items: center; justify-content: center; font-size: 1.8rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: transform 0.1s;
        }
        .icon:active { transform: scale(0.9); }
        .label { font-size: 0.75rem; margin-top: 8px; color: #555; font-weight: 500; }

        /* --- CHAT APP (The Good Part) --- */
        .win { 
            background: #fff; transform: translateY(100%); 
            display: flex; flex-direction: column; z-index: 20;
        }
        .win.open { transform: translateY(0); }

        .chat-head { 
            height: 60px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; 
            padding: 0 15px; padding-top: env(safe-area-inset-top); background: white;
        }
        .back-btn { color: #ff4757; font-weight: 600; padding: 10px; font-size: 1rem; }
        .chat-title { flex: 1; text-align: center; font-weight: 700; margin-right: 40px; font-size: 1.1rem; }

        /* Message Area */
        .chat-body { 
            flex: 1; overflow-y: auto; padding: 20px; 
            display: flex; flex-direction: column; gap: 12px;
            padding-bottom: 180px; /* Space for buttons */
            background: #f9f9f9;
        }
        
        .msg { 
            max-width: 80%; padding: 12px 16px; border-radius: 18px; 
            font-size: 1rem; line-height: 1.4; animation: slideUp 0.3s ease;
        }
        .them { background: white; border-bottom-left-radius: 4px; border: 1px solid #e5e5e5; color: #333; align-self: flex-start; }
        .me { background: #ff4757; border-bottom-right-radius: 4px; color: white; align-self: flex-end; box-shadow: 0 2px 5px rgba(255, 71, 87, 0.3); }

        /* Button Area (Fixed & Safe) */
        .opts-container {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: white; border-top: 1px solid #eee;
            padding: 20px 20px max(30px, env(safe-area-inset-bottom)) 20px;
            display: flex; flex-direction: column; gap: 10px; z-index: 30;
        }
        .reply-btn {
            width: 100%; padding: 16px; background: #ff4757; color: white; 
            border: none; border-radius: 14px; font-size: 1rem; font-weight: 600;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.2); cursor: pointer;
        }
        .reply-btn:active { transform: scale(0.98); }

        /* Gift Animation */
        .gift-box { text-align: center; margin-top: 20px; animation: popIn 0.5s; }
        .big-emoji { font-size: 5rem; display: block; margin-bottom: 10px; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { from { transform: scale(0.8); } to { transform: scale(1); } }

    </style>
</head>
<body>

    <div id="lock" class="full-screen" onclick="unlock()">
        <div class="clock">11:11</div>
        <div style="font-size: 1.2rem; opacity: 0.9;">Wednesday, Feb 4</div>
        <div class="notif">
            <div style="font-size: 0.75rem; color: #666; margin-bottom: 5px;">MESSAGES • NOW</div>
            <strong style="color: #ff4757;">Theshuuuu ❤️</strong>
            <div style="margin-top:2px;">I have a question for you...</div>
        </div>
        <div style="margin-top: auto; margin-bottom: 50px; opacity: 0.8; font-size: 0.9rem;">Tap to Unlock</div>
    </div>

    <div id="home" class="full-screen">
        <div class="home-content">
            <div class="header">
                <div style="font-size:0.8rem; font-weight:700; color:#ff8fa3; letter-spacing:1px;">GOOD MORNING</div>
                <h1>Ayuuuu ❤️</h1>
            </div>

            <div class="card" onclick="openChat()">
                <div>
                    <div style="font-size:0.8rem; color:#888; font-weight:600;">TOGETHER</div>
                    <div style="display:flex; align-items:baseline; gap:5px;">
                        <span class="count-num" id="days">0</span>
                        <span style="font-weight:700; color:#ff8fa3;">DAYS</span>
                    </div>
                    <div style="font-size:0.8rem; color:#aaa; margin-top:5px;">Since Jan 18, 2026</div>
                </div>
                <div style="font-size:2.5rem;">💑</div>
            </div>

            <div class="card" style="padding:15px; margin-top:15px;">
                <div style="display:flex; align-items:center; gap:15px;">
                    <div style="background:#ff4757; color:white; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;">💬</div>
                    <div>
                        <div style="font-weight:700;">Theshuuuu</div>
                        <div style="font-size:0.85rem; color:#666;">Sent you a message</div>
                    </div>
                </div>
                <button onclick="openChat()" style="background:#ff4757; color:white; border:none; padding:8px 15px; border-radius:20px; font-size:0.8rem; font-weight:600;">Open</button>
            </div>

            <div class="apps">
                <div class="icon-btn" onclick="openChat()">
                    <div class="icon" style="color:#ff4757;">💬</div><span class="label">Chat</span>
                </div>
                <div class="icon-btn" onclick="alert('My Birthday: Mar 14 🎂\nYour Birthday: Sep 22 👸')">
                    <div class="icon" style="color:#ff9f43;">🎂</div><span class="label">Events</span>
                </div>
                <div class="icon-btn" onclick="alert('Flight ticket coming soon... ✈️')">
                    <div class="icon" style="color:#54a0ff;">✈️</div><span class="label">Ticket</span>
                </div>
                <div class="icon-btn" onclick="alert('I love you! ❤️')">
                    <div class="icon" style="color:#4cd137;">❤️</div><span class="label">Love</span>
                </div>
            </div>
        </div>
    </div>

    <div id="chat" class="full-screen win">
        <div class="chat-head">
            <div class="back-btn" onclick="closeChat()">❮ Back</div>
            <div class="chat-title">Theshuuuu ❤️</div>
        </div>
        
        <div class="chat-body" id="feed"></div>
        
        <div id="opts" class="opts-container hidden"></div>
    </div>

    <script>
        // --- NAVIGATION ---
        function unlock() { document.getElementById('lock').style.transform = 'translateY(-100%)'; }
        function openChat() { document.getElementById('chat').classList.add('open'); }
        function closeChat() { document.getElementById('chat').classList.remove('open'); }

        // --- DATE LOGIC (FIXED) ---
        // Current Date: Feb 4, 2026. 
        // Met Date: Jan 18, 2026.
        const start = new Date("2026-01-18");
        const now = new Date();
        const diff = Math.floor((now - start) / (1000 * 60 * 60 * 24));
        document.getElementById('days').innerText = diff > 0 ? diff : 0;

        // --- CHAT SYSTEM ---
        const feed = document.getElementById('feed');
        const opts = document.getElementById('opts');

        const script = {
            1: { msg: "Happy Valentine's Day Ayuuu! 🌹", btn: "Happy Valentine's Theshu! ❤️", next: 2 },
            2: { msg: "I miss you so much. I was just thinking about Jan 18... the day we met. ❤️", btn: "Best day ever 🥰", next: 3 },
            3: { msg: "Distance is hard, but you are worth every mile. I have a question...", btn: "What is it? 😮", next: 4 },
            4: { msg: "<b>Will you be my Valentine?</b> Forever? 💍", btn: "YES! Of course! ❤️", next: 5 },
            5: { msg: "I knew it! ❤️ Tap the gift box below!", btn: null, next: null, action: 'gift' }
        };

        function addMsg(text, type) {
            const d = document.createElement('div');
            d.className = 'msg ' + type;
            d.innerHTML = text;
            feed.appendChild(d);
            feed.scrollTop = feed.scrollHeight;
        }

        function showBtn(text, nextStep) {
            opts.innerHTML = '';
            if(!text) { opts.classList.add('hidden'); return; }
            
            opts.classList.remove('hidden');
            const b = document.createElement('button');
            b.className = 'reply-btn';
            b.innerText = text;
            b.onclick = () => {
                addMsg(text, 'me');
                opts.classList.add('hidden');
                
                setTimeout(() => {
                    const stepData = script[nextStep];
                    if(stepData) {
                        addMsg(stepData.msg, 'them');
                        if(stepData.action === 'gift') spawnGift();
                        else showBtn(stepData.btn, stepData.next);
                    }
                }, 1000);
            };
            opts.appendChild(b);
        }

        function spawnGift() {
            const div = document.createElement('div');
            div.className = 'gift-box';
            div.innerHTML = `<span class="big-emoji" onclick="this.innerText='💍'; this.nextElementSibling.innerText='One day... ❤️'">🎁</span><div style="color:#ff4757; font-weight:bold;">Tap to open</div>`;
            feed.appendChild(div);
            feed.scrollTop = feed.scrollHeight;
        }

        // Init
        setTimeout(() => {
            if(feed.innerHTML === "") {
                addMsg(script[1].msg, 'them');
                showBtn(script[1].btn, script[1].next);
            }
        }, 800);

    </script>
</body>
</html>
