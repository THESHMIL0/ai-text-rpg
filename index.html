<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Ayushka ❤️</title>
    <style>
        /* --- CSS STYLES --- */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            user-select: none; /* Prevents text highlighting */
        }

        /* LOGIN SCREEN */
        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffe6e6;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s;
        }
        
        #login-box {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-top: 15px;
            font-size: 1rem;
            outline: none;
            width: 200px;
            text-align: center;
        }

        /* MAIN APP CONTAINER */
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            max-width: 90%;
            width: 400px;
            text-align: center;
            display: none; /* Hidden until login */
            margin: 40px 0;
            position: relative;
            z-index: 10;
        }

        h1 { color: #d63384; margin-bottom: 5px; font-size: 2rem; }
        p { color: #666; line-height: 1.6; }

        /* UNIVERSAL BUTTON STYLE */
        .btn {
            background: linear-gradient(45deg, #ff6b6b, #d63384);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            margin: 8px 0;
            width: 100%;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(214, 51, 132, 0.3);
        }
        .btn:active { transform: scale(0.95); }

        /* MOOD GRID */
        .mood-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }
        .mood-btn {
            background: white;
            border: 2px solid #ffb3c1;
            color: #d63384;
            padding: 15px 5px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .mood-btn:hover { background: #fff0f5; border-color: #d63384; }

        /* GIFT BOX ANIMATION */
        .gift-container { margin: 20px 0; perspective: 1000px; cursor: pointer; }
        .gift-box { font-size: 4rem; transition: transform 0.5s; display: inline-block; }
        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(10deg); }
            50% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
            100% { transform: rotate(0deg); }
        }

        /* DO NOT PRESS BUTTON */
        .danger-btn {
            background: #ff4757;
            box-shadow: 0 4px 0 #cf3442;
            margin-top: 20px;
        }
        .danger-btn:active {
            box-shadow: 0 0 0 #cf3442;
            transform: translateY(4px);
        }

        /* MODAL POPUP */
        #message-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 80%;
            text-align: center;
            animation: popIn 0.3s ease;
        }
        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* ANIMATION ELEMENTS */
        .kiss, .confetti {
            position: absolute;
            pointer-events: none;
            z-index: 999;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-200px) scale(1.5); opacity: 0; }
        }
        @keyframes fallDown {
            to { transform: translateY(100vh) rotate(720deg); }
        }

        /* MISC */
        .close-btn { margin-top: 15px; padding: 8px 20px; background: #eee; border: none; border-radius: 20px; cursor: pointer; }
        .love-calc { margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; }
        #date-idea { font-weight: bold; color: #1565c0; margin: 10px 0; }

    </style>
</head>
<body>

    <div id="login-screen">
        <div id="login-box">
            <h2>🔒 Priority Access</h2>
            <p>Enter name to unlock:</p>
            <input type="text" id="password-input" placeholder="Her Name...">
            <br>
            <button class="btn" style="width: auto; margin-top: 20px;" onclick="checkPassword()">Unlock ❤️</button>
            <p id="error-msg" style="color:red; display:none; margin-top:10px;">Hint: Ayushka</p>
        </div>
    </div>

    <div class="container" id="main-content">
        <h1>Hey Ayushka! ❤️</h1>
        <p>Welcome to your personal love station.</p>

        <button class="btn" onclick="sendKiss()" style="position: relative; overflow: hidden;">
            💋 Send Me a Kiss
        </button>

        <p style="font-size: 0.8rem; color: #aaa; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px;">Open When...</p>
        <div class="mood-grid">
            <button class="mood-btn" onclick="openMessage('miss')">💌<br>Miss You</button>
            <button class="mood-btn" onclick="openMessage('sad')">😢<br>Sad</button>
            <button class="mood-btn" onclick="openMessage('happy')">🥰<br>Happy</button>
            <button class="mood-btn" onclick="openMessage('us')">🔒<br>Future</button>
        </div>

        <div class="gift-container" onclick="openGift()">
            <p style="font-size: 0.9rem; margin-bottom: 5px;">A Virtual Gift For You:</p>
            <div id="gift-icon" class="gift-box">🎁</div>
            <p id="gift-msg" style="display:none; color: #d63384; font-weight: bold; margin-top: 10px;">A Promise Ring! 💍<br><span style="font-size:0.8rem; font-weight:normal; color:#555;">To remind you that I'm yours.</span></p>
        </div>

        <div class="love-calc">
            <p>🧬 COMPATIBILITY SCAN</p>
            <button class="btn" id="calc-btn" style="background: #333;" onclick="calculateLove()">Tap to Scan Fingerprint</button>
            <div id="love-result" style="display:none; font-size: 1.5rem; font-weight: bold; color: #d63384;">100% MATCH! 🔥</div>
        </div>

        <div style="background: #e3f2fd; padding: 15px; border-radius: 15px; margin-top: 20px; border: 2px dashed #90caf9;">
            <p style="margin:0; font-size: 0.9rem; color: #1565c0;">🔮 DATE NIGHT GENERATOR</p>
            <p id="date-idea">❓</p>
            <button class="btn" style="background: #2196f3; font-size: 0.8rem; padding: 8px 15px; width: auto;" onclick="pickDate()">Pick Idea</button>
        </div>

        <button class="btn danger-btn" onclick="triggerExplosion()">🚫 DO NOT PRESS</button>

    </div>

    <div id="message-modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div style="font-size: 3rem; margin-bottom: 10px;" id="modal-emoji"></div>
            <h3 id="modal-title" style="color: #d63384; margin: 0;"></h3>
            <p id="modal-body" style="font-size: 1.1rem; margin: 15px 0;"></p>
            <button class="close-btn" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        const password = "Ayushka"; 

        // 1. LOCK SCREEN
        function checkPassword() {
            const input = document.getElementById("password-input").value;
            if (input.toLowerCase() === password.toLowerCase()) {
                document.getElementById("login-screen").style.opacity = "0";
                setTimeout(() => {
                    document.getElementById("login-screen").style.display = "none";
                    document.getElementById("main-content").style.display = "block";
                }, 800);
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }

        // 2. OPEN WHEN
        const messages = {
            'miss': { emoji: "🌏", title: "When you miss me...", text: "Look at the sky. We are under the same one. I am thinking of you right now." },
            'sad': { emoji: "🫂", title: "When you are sad...", text: "I wish I could hug you. You are strong, beautiful, and loved." },
            'happy': { emoji: "✨", title: "When you are happy...", text: "Your smile is my favorite thing. Keep shining!" },
            'us': { emoji: "💍", title: "Our Future...", text: "One day, no more goodbyes. Only goodnights." }
        };
        function openMessage(mood) {
            const data = messages[mood];
            document.getElementById("modal-emoji").innerText = data.emoji;
            document.getElementById("modal-title").innerText = data.title;
            document.getElementById("modal-body").innerText = data.text;
            document.getElementById("message-modal").style.display = "flex";
        }
        function closeModal() { document.getElementById("message-modal").style.display = "none"; }

        // 3. GIFT BOX LOGIC
        function openGift() {
            const box = document.getElementById("gift-icon");
            const msg = document.getElementById("gift-msg");
            if (box.innerHTML === "🎁") {
                box.classList.add("shake");
                setTimeout(() => {
                    box.classList.remove("shake");
                    box.innerHTML = "💍";
                    msg.style.display = "block";
                }, 500);
            }
        }

        // 4. LOVE CALCULATOR
        function calculateLove() {
            const btn = document.getElementById("calc-btn");
            btn.innerText = "Scanning...";
            btn.style.background = "#555";
            setTimeout(() => {
                btn.style.display = "none";
                document.getElementById("love-result").style.display = "block";
            }, 1500);
        }

        // 5. KISS ANIMATION
        function sendKiss() {
            createFloatingEmoji("💋");
        }

        // 6. DATE GENERATOR
        const dates = ["Late night drive 🚗", "Cooking together 🍝", "Movie marathon ⛺", "Beach sunset 🌅", "Stargazing ✨"];
        function pickDate() {
            document.getElementById("date-idea").innerText = dates[Math.floor(Math.random() * dates.length)];
        }

        // 7. DANGER BUTTON (CONFETTI)
        function triggerExplosion() {
            alert("I TOLD YOU NOT TO PRESS IT! 😱\n\nBut since you did...");
            for(let i=0; i<50; i++) {
                setTimeout(() => createFloatingEmoji(["❤️", "💖", " I LOVE YOU"][Math.floor(Math.random()*3)]), i * 50);
            }
        }

        // HELPER: Floating Emojis
        function createFloatingEmoji(char) {
            const el = document.createElement("div");
            el.innerText = char;
            el.style.position = "fixed";
            el.style.left = Math.random() * 100 + "vw";
            el.style.top = "100vh";
            el.style.fontSize = (Math.random() * 2 + 1) + "rem";
            el.style.animation = "floatUp 3s ease-out forwards";
            el.style.zIndex = "9999";
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }
    </script>
</body>
</html>
