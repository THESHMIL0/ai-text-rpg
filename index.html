<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For You ❤️</title>
    <style>
        /* SIMPLE DESIGN */
        body {
            margin: 0; padding: 0; height: 100dvh; width: 100vw;
            background: linear-gradient(135deg, #ffc3a0 0%, #ffafbd 100%);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Segoe UI', sans-serif; overflow: hidden;
        }

        /* THE CARD */
        .card {
            background: white; width: 300px; padding: 40px 20px;
            border-radius: 20px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative; transition: 0.3s;
        }

        /* ENVELOPE COVER */
        .envelope {
            cursor: pointer; animation: float 3s infinite ease-in-out;
        }
        .envelope-icon { font-size: 80px; line-height: 1; }
        .tap-hint { color: #ff4757; font-weight: bold; margin-top: 10px; font-size: 0.9rem; }

        /* HIDDEN CONTENT */
        .content { display: none; opacity: 0; transition: 1s; }
        .show-content { display: block; animation: fadeIn 1s forwards; }

        h1 { color: #ff4757; margin: 0 0 10px 0; font-size: 1.8rem; }
        p { color: #555; margin-bottom: 30px; font-size: 1rem; }

        /* BUTTONS */
        .btn-group { display: flex; gap: 15px; justify-content: center; position: relative; height: 50px; }
        
        button {
            padding: 12px 30px; border: none; border-radius: 50px;
            font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-yes { background: #ff4757; color: white; box-shadow: 0 5px 15px rgba(255, 71, 87, 0.3); }
        .btn-no { background: #eee; color: #555; position: relative; }

        /* ANIMATIONS */
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes heartDrop { to { transform: translateY(100vh); } }

        .heart { position: fixed; top: -20px; font-size: 20px; animation: heartDrop 3s linear forwards; }

    </style>
</head>
<body>

    <div class="card" id="mainCard">
        
        <div class="envelope" onclick="openCard()">
            <div class="envelope-icon">💌</div>
            <div class="tap-hint">(Tap to Open)</div>
        </div>

        <div class="content" id="secretContent">
            <h1>Hey Ayuuu! ❤️</h1>
            <p>I have a question...</p>
            <div style="font-size: 4rem; margin: 20px 0;">🌹</div>
            <p style="font-weight: bold; color: #ff4757;">Will you be my Valentine?</p>
            
            <div class="btn-group">
                <button class="btn-yes" onclick="sayYes()">YES!</button>
                <button class="btn-no" id="noBtn" onmouseover="moveNo()" ontouchstart="moveNo()">NO</button>
            </div>
        </div>

    </div>

    <script>
        function openCard() {
            document.querySelector('.envelope').style.display = 'none';
            document.getElementById('secretContent').classList.add('show-content');
        }

        function moveNo() {
            const btn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 100);
            btn.style.position = 'fixed'; // Breaks out of the card
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function sayYes() {
            document.getElementById('mainCard').innerHTML = "<h1>YAY! ❤️</h1><p>I love you!</p><div style='font-size:5rem'>💑</div>";
            setInterval(createHeart, 100);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = "❤️";
            heart.className = 'heart';
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = Math.random() * 2 + 3 + "s";
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
    </script>

</body>
</html>
